/* Layout : accueil = grandes tuiles de familles ; rubrique = liste d'outils ; outil = formulaire + résultat sur bande jaune "mètre pliant" */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#22262a; --muted:#5c646b; --line:#d5d9d6;
  --ruler:#f2c230; --ruler-ink:#2a2306; --accent:#1f5d8c; --ok:#2f7a45; --warn:#a4461d;
  --piece:#cfe0ee; --piece-line:#1f5d8c; --panel:#efe6d2; --pattern:none;
  --c-ph:#d32f2f; --c-ne:#1f6fd1; --c-te:#2e9d4b; --c-te2:#f2d22e; --c-rt:#ef7d00; --c-n1:#8e44ad; --c-n2:#8b5a2b; --c-cmd:#4a4f55; --c-flow:rgba(255,255,255,.95); --hl:rgba(31,93,140,.12); --sch-bg:#fbfbf8;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171a1d; --surface:#22262b; --ink:#eef0ee; --muted:#a6adb3; --line:#3a4047;
  --ruler:#e6b81f; --ruler-ink:#1d1803; --accent:#7fb6e0; --ok:#6cc488; --warn:#f0946a;
  --piece:#28455e; --piece-line:#7fb6e0; --panel:#3b352a; --c-ne:#4c97f0; --c-cmd:#b8bec5; --c-n2:#b07a45; --c-n1:#b072d6; --hl:rgba(127,182,224,.18); --sch-bg:#1d2125; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#171a1d; --surface:#22262b; --ink:#eef0ee; --muted:#a6adb3; --line:#3a4047;
  --ruler:#e6b81f; --ruler-ink:#1d1803; --accent:#7fb6e0; --ok:#6cc488; --warn:#f0946a;
  --piece:#28455e; --piece-line:#7fb6e0; --panel:#3b352a; --c-ne:#4c97f0; --c-cmd:#b8bec5; --c-n2:#b07a45; --c-n1:#b072d6; --hl:rgba(127,182,224,.18); --sch-bg:#1d2125; color-scheme:dark }

/* Style « Établi » : bois clair, noyer et vert forêt */
:root[data-skin="etabli"]{
  --bg:#ecdfc6; --surface:#faf4e8; --ink:#2b1d12; --muted:#6a5440; --line:#d3bf9c;
  --ruler:#6b4426; --ruler-ink:#fbf1e0; --accent:#2f5d3a; --ok:#2f6d3e; --warn:#a23b17;
  --piece:#e2c99b; --piece-line:#6b4426; --panel:#f4ead6;
  --display:"Zilla Slab", Georgia, serif;
  --pattern:repeating-linear-gradient(0deg,rgba(107,68,38,.06) 0 2px,transparent 2px 11px); color-scheme:light }
/* Style « Plan bleu » : papier de plan d'architecte */
:root[data-skin="plan"]{
  --bg:#133b64; --surface:#184877; --ink:#f1f6fb; --muted:#b3cbe3; --line:#4a77a3;
  --ruler:#f1f6fb; --ruler-ink:#133b64; --accent:#ffd24a; --ok:#8fe3a8; --warn:#ffb08a;
  --piece:#2c66a3; --piece-line:#f1f6fb; --panel:#0f3256;
  --display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --pattern:linear-gradient(rgba(241,246,251,.07) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(241,246,251,.07) 1px,transparent 1px) 0 0/24px 24px; color-scheme:dark }
:root[data-skin="plan"] h1,:root[data-skin="plan"] h2,:root[data-skin="plan"] .tile b{text-transform:uppercase;letter-spacing:.03em}

/* Taille du texte */
html{font-size:19px}
html[data-size="grand"]{font-size:22px}
html[data-size="tresgrand"]{font-size:25px}

*{box-sizing:border-box}
body{background:var(--pattern),var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.ruler{height:14px;border-radius:3px;background:
  repeating-linear-gradient(90deg,var(--ruler-ink) 0 2px,transparent 2px 20px) bottom/100% 6px no-repeat,
  repeating-linear-gradient(90deg,var(--ruler-ink) 0 2px,transparent 2px 100px) bottom/100% 12px no-repeat,
  var(--ruler)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;
  padding:20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--ink)}
.tile b{font-family:var(--display);font-weight:800;font-size:1.45rem}
.tile span{color:var(--muted);font-size:.95rem}
.tile.tool b{font-size:1.2rem}
.tile svg{width:46px;height:46px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.skin,.size{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px}
.skin[aria-pressed="true"],.size[aria-pressed="true"]{border-color:var(--ink);border-width:3px;padding:13px}
.sw{display:flex;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.sw i{flex:1}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.size{align-items:center;text-align:center;gap:2px}
.size span{font-weight:400;font-size:.85rem;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{font:inherit;font-weight:700;background:none;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;align-self:flex-start}
.chip{font:inherit;font-weight:700;background:var(--ruler);color:var(--ruler-ink);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.hint{color:var(--muted);margin:-8px 0 0;font-size:.95rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:1rem}
label .u{font-weight:400;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:10px}
label.check input{width:26px;height:26px}
input,select{font:inherit;font-size:1.2rem;padding:11px 13px;border:2px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);width:100%;font-variant-numeric:tabular-nums;min-width:0}
.pieces{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;gap:8px;align-items:end}
.prow label{font-size:.9rem}
.del{font:inherit;background:none;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer}
.result{background:var(--ruler);color:var(--ruler-ink);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.detail{font-size:1rem}
.detail div+div{margin-top:2px}
.warn{color:var(--warn);font-weight:700}
.btn{font:inherit;font-weight:700;font-size:1.05rem;padding:14px 18px;border-radius:10px;border:2px solid var(--ink);
  background:var(--ink);color:var(--bg);cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.toast{color:var(--ok);font-weight:700;min-height:1.5em;margin:0}
.plans{display:flex;flex-direction:column;gap:16px}
.plans figure{margin:0;display:flex;flex-direction:column;gap:6px}
.plans figcaption{font-weight:700;font-size:.95rem}
.plans svg{width:100%;height:auto;display:block}
.plans .pan{fill:var(--panel);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.plans .pc{fill:var(--piece);stroke:var(--piece-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.plans text{fill:var(--ink);font-family:var(--body);font-weight:700}
.bar{display:flex;height:38px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--panel)}
.bar div{background:var(--piece);border-right:2px solid var(--piece-line);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;overflow:hidden;white-space:nowrap;min-width:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li b{min-width:0}
.empty{color:var(--muted)}
[hidden]{display:none!important}
html.fondu body{animation:fondu .7s ease-out both}
@keyframes fondu{from{opacity:0}}
@media (prefers-reduced-motion:reduce){html.fondu body{animation:none}}
.tab{display:flex;flex-direction:column;gap:14px}
.tab figure{margin:0;display:flex;flex-direction:column;gap:4px}
.tab figcaption{font-weight:700;font-size:.9rem}
.tab-row{display:grid;gap:2px;padding:6px;border:2px solid var(--ink);border-radius:6px;background:var(--panel)}
.mod{height:118px;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.66rem;font-weight:700;line-height:1.1;min-width:0}
.mod span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.m-id{background:var(--ink);color:var(--bg)}
.m-dj{background:var(--piece);border:1.5px solid var(--piece-line);color:var(--ink)}
.m-ct{background:var(--ruler);color:var(--ruler-ink)}
.m-pf{background:var(--warn);color:var(--surface)}
.m-free{border:1.5px dashed var(--line)}
.legend-mods{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem}
.legend-mods span{display:flex;align-items:center;gap:6px}
.legend-mods i{display:inline-block;width:16px;height:16px}
.tab-g ul,.tab-notes ul{margin:4px 0 0;padding-left:22px;font-size:.95rem}
.tab-g .u{color:var(--muted);font-size:.9rem}
.tab-notes p{margin:8px 0 0}
/* Bibliothèque de schémas */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{font:inherit;font-size:.95rem;font-weight:700;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--ruler);color:var(--ruler-ink);border-color:var(--ruler)}
#sch-view{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
#sch-view h3{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0}
.sch-res{margin:-6px 0 0;color:var(--muted)}
.sch-fig{background:var(--sch-bg);border:1px solid var(--line);border-radius:12px;padding:6px}
.sch-fig svg{width:100%;height:auto;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{padding:10px 14px}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fils{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem}
.fils span{display:flex;align-items:center;gap:8px}
i.sw{display:inline-block;width:28px;height:7px;border-radius:3px;flex:0 0 28px}
i.k-ph{background:var(--c-ph)} i.k-ne{background:var(--c-ne)} i.k-rt{background:var(--c-rt)} i.k-rt2,i.k-n1{background:var(--c-n1)} i.k-n2{background:var(--c-n2)} i.k-cmd{background:var(--c-cmd)}
i.k-te{background:repeating-linear-gradient(90deg,var(--c-te) 0 7px,var(--c-te2) 7px 11px)}
.sch-txt{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;font-size:.95rem}
.sch-txt ol,.sch-txt ul{margin:6px 0 0;padding-left:22px}
.sch-txt li+li{margin-top:4px}
#sch-svg .w{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#sch-svg .k-ph{stroke:var(--c-ph)} #sch-svg .k-ne{stroke:var(--c-ne)} #sch-svg .k-te{stroke:var(--c-te)} #sch-svg .te2{stroke:var(--c-te2);stroke-dasharray:5 7}
#sch-svg .k-rt{stroke:var(--c-rt)} #sch-svg .k-rt2,#sch-svg .k-n1{stroke:var(--c-n1)} #sch-svg .k-n2{stroke:var(--c-n2)} #sch-svg .k-cmd{stroke:var(--c-cmd)}
.flow{fill:none;stroke:var(--c-flow);stroke-width:1.8;stroke-dasharray:3 9;stroke-linecap:round;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
#sch-svg .dot{fill:var(--ink)} #sch-svg .term{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
#sch-svg .blade{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
#sch-svg .hit{fill:transparent;rx:6px}
#sch-svg .act{cursor:pointer} #sch-svg .act:focus{outline:none} #sch-svg .act:hover .hit,#sch-svg .act:focus-visible .hit{fill:var(--hl)}
#sch-svg .tb{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} #sch-svg .bx{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
#sch-svg .lbl{font:700 11px var(--body);fill:var(--ink)} #sch-svg .sm{font:400 10px var(--body);fill:var(--ink)} #sch-svg .xs{font:400 8.5px var(--body);fill:var(--muted)} #sch-svg .b{font-weight:700}
#sch-svg .lamp{fill:var(--surface);stroke:var(--ink);stroke-width:2} #sch-svg .lamp.on{fill:#ffd54a} #sch-svg .lampx{stroke:var(--ink);stroke-width:1.6}
#sch-svg .glow{fill:#ffd54a;opacity:.35} #sch-svg .rays{stroke:#f2b400;stroke-width:2.2;stroke-linecap:round}
#sch-svg .coil{fill:var(--surface);stroke:var(--ink);stroke-width:1.5} #sch-svg .coil.on{fill:var(--c-rt)}
#sch-svg .inner{stroke:var(--ink);stroke-width:1.5;fill:none}
#sch-svg .bphead{fill:var(--muted)} #sch-svg .bphead.on{fill:var(--c-rt)}
#sch-svg .prise{fill:var(--surface);stroke:var(--ink);stroke-width:2} #sch-svg .prise.on{stroke:var(--c-rt);stroke-width:3}
#sch-svg .trou{fill:var(--ink)} #sch-svg .fiche{fill:var(--accent);opacity:.85}
#sch-svg .motor{fill:var(--surface);stroke:var(--ink);stroke-width:2} #sch-svg .motor.on{fill:var(--hl);stroke:var(--c-rt)}
#sch-svg .win{fill:#bfe0f5;stroke:var(--ink);stroke-width:2} #sch-svg .shut{fill:#c9ccd0;stroke:var(--ink);stroke-width:1} #sch-svg .slat{stroke:#8b9097;stroke-width:1}
#sch-svg .sel{fill:var(--ruler);stroke:var(--ruler-ink);stroke-width:1} #sch-svg .sel+text{fill:var(--ruler-ink)}
#sch-svg .tank{fill:#dbe9f6;stroke:var(--ink);stroke-width:2} #sch-svg .tank.hot{fill:#f6d9cf}
#sch-svg .res{fill:none;stroke:#8b9097;stroke-width:2} #sch-svg .res.on{stroke:#ff6a00;stroke-width:2.6}
#sch-svg .bub{fill:#fff;stroke:#7aa7d6;animation:bub 1.6s ease-in infinite} #sch-svg .b2{animation-delay:.5s} #sch-svg .b3{animation-delay:1s}
@keyframes bub{from{transform:translateY(10px);opacity:0}30%{opacity:1}to{transform:translateY(-30px);opacity:0}}
#sch-svg .rad{fill:var(--surface);stroke:var(--ink);stroke-width:2} #sch-svg .fin{stroke:var(--line);stroke-width:2}
#sch-svg .wave{fill:none;stroke:#ff6a00;stroke-width:2.4;stroke-linecap:round;animation:rise 2s ease-in-out infinite}
@keyframes rise{50%{transform:translateY(-4px)}}
#sch-svg .scope{fill:#10261a;stroke:var(--ink)} #sch-svg .axis{stroke:#2f5f45;stroke-width:1} #sch-svg .sig{fill:none;stroke:#5cf08a;stroke-width:2}
#sch-svg .dome{fill:var(--muted)} #sch-svg .cone{stroke:var(--c-rt);stroke-width:1.5;stroke-dasharray:3 4;fill:none}
#sch-svg .pers{stroke:var(--ink);stroke-width:2.5;fill:none} #sch-svg .pers circle{fill:var(--ink)}
#sch-svg .wall{fill:var(--surface);stroke:var(--ink);stroke-width:2} #sch-svg .scr{fill:var(--line)} #sch-svg .scr.on{fill:#3fb86a}
#sch-svg .cord{fill:none;stroke:var(--ink);stroke-width:3} #sch-svg .car{fill:var(--accent);stroke:var(--ink);stroke-width:1.5} #sch-svg .wheel{fill:var(--ink)}
#sch-svg .batt{fill:var(--surface);stroke:var(--ink);stroke-width:1.5} #sch-svg .battf{fill:#3fb86a}
@media (prefers-reduced-motion:reduce){.flow,#sch-svg .bub,#sch-svg .wave{animation:none}}
.symb{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sy{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}
.sy svg{width:76px;flex:0 0 76px;height:auto;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sy div{display:flex;flex-direction:column;min-width:0} .sy span{color:var(--muted);font-size:.85rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cols div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px} .cols span{flex-basis:100%;color:var(--muted);font-size:.9rem}
.pl-svg{font-family:inherit}
.pl-svg rect,.pl-svg polygon,.pl-svg ellipse{stroke:#3a3f44;stroke-width:.8}
.pl-cu{fill:#cf8a52}.pl-cu2{fill:#b8703c}.pl-lai{fill:#d8b64e}.pl-lai2{fill:#c49b2c}.pl-olive{fill:#e8cf7a}.pl-per{fill:#3d7fd6}.pl-gaine{fill:#e0e3e6}
.pl-pe{fill:#f4f4f1}.pl-pe2{fill:#ebebe6}.pl-alu{fill:#9ea7ae}.pl-pvc{fill:#a5adb3}.pl-pvc2{fill:#8e979e}.pl-noir{fill:#33373b}.pl-bleu{fill:#2f7fd8}
.pl-acier{fill:#8f989f}.pl-inox{fill:#7d878e}.pl-joint{fill:#222}.pl-sold{fill:#d9dde1}.pl-colle{fill:#f0c93a}.pl-fil{fill:#c9a764}.pl-gris{fill:#c9ced2}.pl-blanc{fill:#f6f6f3}
.pl-vide{fill:#1d2a35}.pl-vide2{fill:transparent;stroke-dasharray:3 2}.pl-eau{fill:#bfe0f7;stroke:none!important;opacity:.7}.pl-reflet{fill:#fff;opacity:.28;stroke:none!important}
.pl-ann{stroke:#9aa1a6;stroke-width:1}.pl-ld{stroke:var(--muted);stroke-width:.8;fill:none}.pl-axe{stroke:var(--muted);stroke-width:.6;stroke-dasharray:8 3 2 3}
.pl-tx{fill:var(--ink);font-size:10.5px}.pl-flam{fill:#ff8a1c;stroke:#d9480f!important}.pl-fl{stroke:#d32f2f;stroke-width:2;fill:none}
.pl-fen{fill:#ffd54a}.pl-mach{fill:none;stroke:#d32f2f;stroke-dasharray:4 3;stroke-width:1.2}
.pl-mur{fill:#c8b79c;stroke:none!important;opacity:.5}.pl-sol{stroke:#6b5a43;stroke-width:2}.pl-toit{stroke:#8a4b2f;stroke-width:3;fill:none}.pl-app{fill:#fff;stroke:#555;stroke-width:1.2}
.pl-p32,.pl-p40,.pl-p100{fill:none;stroke:#8e979e;stroke-linejoin:round}.pl-p32{stroke-width:4}.pl-p40{stroke-width:5}.pl-p100{stroke-width:9}
.lien{background:none;border:0;padding:0;color:var(--accent,#1f5d8c);text-decoration:underline;font:inherit;cursor:pointer}
.el-body{fill:#f1f2f0;stroke:#5a6066;stroke-width:1}.el-vis{fill:#c9ced2;stroke:#5a6066;stroke-width:.8}.el-fen{fill:#dfe3e6;stroke:#5a6066;stroke-width:.8}
.el-lev{stroke:#333;stroke-width:.8}.el-lev-d{fill:#3b4046}.el-lev-b{fill:#2f6fd6}.el-lev-g{fill:#7a8087}.el-btn{fill:#f2c94c;stroke:#555;stroke-width:.8}
.el-mt{fill:#2b2f33;font-size:8.5px;font-weight:600}.el-rail{fill:#b9bfc4;stroke:#7d858c;stroke-width:.8}.el-bp{fill:#8b4a2b}.el-bn{fill:#2f6fd6}
.el-ph,.el-n,.el-t,.el-t2,.el-cmd{fill:none;stroke-width:3;stroke-linejoin:round}.el-ph{stroke:#8b4a2b}.el-n{stroke:#2f6fd6}.el-t{stroke:#3aa04a}.el-t2{stroke:#f2d43a;stroke-dasharray:5 5}.el-cmd{stroke:#e08a1e;stroke-width:2;stroke-dasharray:6 3}
.el-cof{fill:var(--card,#fff);stroke:var(--muted);stroke-width:1.2}.el-mod{cursor:pointer}.el-mod:hover .el-body,.el-mod.on .el-body{fill:#ffe48a}
.el-flux{fill:none;stroke:#f6d2b3;stroke-width:1.3;stroke-dasharray:3 9;animation:elFlux 1.2s linear infinite}@keyframes elFlux{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.el-flux{animation:none}}
.el-pastille{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}.el-pvj{background:repeating-linear-gradient(90deg,#3aa04a 0 4px,#f2d43a 4px 8px)}
.tbl tr.hl td{background:var(--hl)}
.tbl{overflow-x:auto} .tbl table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:520px}
.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top} .tbl th{font-size:.85rem;color:var(--muted);font-weight:700}
.tbl .u{color:var(--muted);font-size:.85rem}
.stair{width:100%;height:auto;max-height:440px;display:block;background:var(--sch-bg);border:1px solid var(--line);border-radius:12px}
.stair .st-floor{fill:var(--ink)}
.stair .st-step{fill:var(--piece);stroke:var(--piece-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.stair .st-limon{fill:var(--panel);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.stair .st-beton{fill:#b9bcbf;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.stair .st-slab{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.stair .st-dash{stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5;fill:none;vector-effect:non-scaling-stroke}
.stair text{fill:var(--ink);font-family:var(--body);font-weight:700}
.stair text.st-dlab{fill:var(--warn)}
/* Menuiserie */
.mv{width:100%;height:auto;max-height:460px;display:block;background:var(--sch-bg);border:1px solid var(--line);border-radius:12px}
.mv .mv-p{fill:var(--piece);stroke:var(--piece-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mv .mv-m{fill:#d9b98a;stroke:#8a6a3f;stroke-width:1.5;vector-effect:non-scaling-stroke}
.mv .mv-d{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.mv .mv-mur{fill:var(--line)}
.mv .mv-sol{stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke}
.mv .mv-cote{stroke:var(--muted);stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke}
.mv text{fill:var(--ink);font-family:var(--body);font-weight:700}
.mv text.mv-t{fill:var(--muted);font-weight:400}

/* Accueil : rubriques en boutons oblongs pastel ; les sujets s'affichent à côté (ordinateur) ou dessous (téléphone) */
.rubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;max-width:340px;width:100%}
.rub{--txt:#22262a;position:relative}
.rub-btn{font:inherit;width:100%;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border:0;border-radius:999px;
  background:var(--c);color:var(--txt);cursor:pointer;text-align:left;transition:background-color .2s, box-shadow .2s, transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rub-btn b{font-family:var(--display);font-weight:800;font-size:1.25rem;flex:1;min-width:0}
.rub-ic{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center}
.rub-ic svg{width:28px;height:28px;fill:none;stroke:#2b3a4a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rub-n{font-size:.8rem;color:#4a4f55;white-space:nowrap}
.rub-fl{font-size:1.5rem;line-height:1;color:#4a4f55;transition:transform .2s}
.rub-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.rub.open .rub-btn{background:var(--c2)}
.rub-t{font:inherit;font-size:1rem;font-weight:700;text-align:left;width:100%;padding:9px 16px;border-radius:999px;border:2px solid var(--c2);background:var(--surface);color:var(--ink);cursor:pointer;transition:background-color .15s,border-color .15s}
.rub-t:hover,.rub-t:focus-visible{background:var(--c);border-color:#2b3a4a;color:#22262a;outline:none}
/* Téléphone : dépliant sous le bouton */
.rub-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.rub-in{overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:0 0 0 52px;min-height:0}
.rub.open .rub-sub{grid-template-rows:1fr}
.rub.open .rub-in{padding:8px 0 4px 52px}
.rub.open .rub-fl{transform:rotate(90deg)}
/* Ordinateur : panneau à droite du bouton */
@media (min-width:720px){
  .rub-sub{display:block;position:absolute;left:100%;top:0;padding-left:14px;width:310px;z-index:20;
    opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .18s,transform .18s,visibility 0s linear .18s}
  .rub-in,.rub.open .rub-in{overflow:visible;padding:10px;background:var(--surface);border:2px solid var(--c2);border-radius:18px;box-shadow:0 10px 26px rgba(0,0,0,.16)}
  .rub.open .rub-sub{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s,visibility 0s}
  .rub.open .rub-fl{transform:none}
}
@media (hover:hover) and (min-width:720px){
  .rub:hover .rub-btn{background:var(--c2);box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateX(2px)}
  .rub:hover .rub-sub,.rub:focus-within .rub-sub{opacity:1;visibility:visible;transform:none;transition:opacity .18s .2s,transform .18s .2s,visibility 0s .2s}
  .rub:hover .rub-fl{transform:translateX(3px)}
}
@media (hover:hover) and (max-width:719px){
  .rub:hover .rub-btn{background:var(--c2)}
}

.rub-gb{display:flex;align-items:center;gap:8px}
.rub-gn{font-size:.75rem;font-weight:700;background:var(--c);color:#22262a;border-radius:999px;padding:1px 8px;margin-left:auto}
.rub-fl2{font-size:1.3rem;line-height:1;transition:transform .2s}
.rub-gs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.rub-gi{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:6px;padding-left:18px}
.rub-g.open .rub-gs{grid-template-rows:1fr}
.rub-g.open .rub-gi{padding-top:6px}
.rub-g.open .rub-gb{background:var(--c);border-color:#2b3a4a;color:#22262a}
.rub-g.open .rub-fl2{transform:rotate(90deg)}
.rub-ts{font-size:.95rem;padding:7px 14px;font-weight:600}
/* Grand écran avec souris : les modèles d'un groupe s'ouvrent dans un second panneau à droite (la liste ne bouge plus) */
@media (hover:hover) and (min-width:1100px){
  .rub-g{position:relative}
  .rub-gs{display:block;position:absolute;left:100%;top:-12px;padding-left:12px;width:270px;z-index:30;
    opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .15s,transform .15s,visibility 0s linear .15s}
  .rub-gi,.rub-g.open .rub-gi{overflow:visible;padding:10px;background:var(--surface);border:2px solid var(--c2);border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.16)}
  .rub-g.open .rub-gs{opacity:1;visibility:visible;transform:none;transition:opacity .15s,transform .15s,visibility 0s}
  .rub-g .rub-fl2,.rub-g.open .rub-fl2{transform:none}
}
.fam-g{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:18px 0 10px}
.fam-g:first-of-type{margin-top:0}
@media (prefers-reduced-motion:reduce){.rub-btn,.rub-sub,.rub-fl,.rub-gs,.rub-fl2{transition:none!important}}

/* Notice de montage en perspective */
.notice{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.notice h3{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0}
.iso{width:100%;height:auto;display:block}
.nt-fin .iso{max-height:480px;background:var(--sch-bg);border:1px solid var(--line);border-radius:12px}
.nt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.nt-s{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--sch-bg);min-width:0}
.nt-s .iso{max-height:280px}
.nt-s p{margin:0;font-size:.95rem}
.nt-leg{margin:0;font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.nt-b,.nt-r{display:inline-block;width:14px;height:14px;border-radius:3px;background:hsl(205 60% 64%);border:1px solid #123a5c}
.nt-r{border-radius:50%;background:#e0312b;border-color:#fff;margin-left:8px}
.iso-f{stroke:#3a2f25;stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.iso-n{stroke:#123a5c}
.iso-v{fill:#e0312b;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.iso-c{stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke;fill:none}
.iso text{fill:var(--ink);font-family:var(--body);font-weight:700}
.mv .mv-b{fill:#6b1f2a;fill-opacity:.85;stroke:#3d0f16;stroke-width:1;vector-effect:non-scaling-stroke}


.phases{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.phases div{display:grid;grid-template-columns:2.2em minmax(0,1fr) 4em;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.phases i{display:block;height:16px;border-radius:3px;background:var(--accent);min-width:2px}
.phases b{text-align:right}
footer{color:var(--muted);font-size:.9rem}
</style>

<body>

<div class="wrap">
  <div class="top">
    <div><h1>Mon Atelier Calculs</h1><p class="sub" id="sub">Choisissez le type de travaux.</p></div>
    <button class="chip" id="golist" type="button">Ma liste (0)</button>
  </div>
  <div class="ruler" aria-hidden="true"></div>
  <main id="view" aria-live="polite"></main>
  <footer>Les quantités sont des estimations. Vérifiez toujours les indications du fabricant.</footer>
</div>

<script>
// Arrivée depuis la page d'accueil (porte qui s'ouvre) : apparition en fondu
try{ if(sessionStorage.getItem('atelier-entree')){ document.documentElement.classList.add('fondu'); sessionStorage.removeItem('atelier-entree'); } }catch(e){}
/* ============ OUTILS DE CALCUL ============ */
const fr = (x, d=1) => (isFinite(x)?x:0).toLocaleString('fr-FR', {maximumFractionDigits:d});
const up = x => Math.ceil(x - 1e-9);
/* le dernier paramètre « si » affiche le champ seulement pour certains choix : {k:'champ', v:['valeur', …]} */
const N = (id, lab, u, def, si) => ({type:'num', id, lab, u, def, si});
const S = (id, lab, options, def, si) => ({type:'sel', id, lab, options, def, si});
const C = (id, lab, def, si) => ({type:'chk', id, lab, def, si});
const P = (id, cols, def) => ({type:'pcs', id, cols, def});

const UNITS = [
  {g:'Longueurs', f:'L', u:[['mm','millimètres',0.001],['cm','centimètres',0.01],['m','mètres',1],['km','kilomètres',1000],['po','pouces',0.0254],['pi','pieds',0.3048]]},
  {g:'Surfaces',  f:'S', u:[['cm2','cm²',0.0001],['m2','m²',1],['are','ares',100],['ha','hectares',10000],['pi2','pieds carrés',0.09290304]]},
  {g:'Volumes',   f:'V', u:[['cm3','cm³',0.000001],['l','litres',0.001],['m3','m³',1]]},
];

/* ============ MENUISERIE ============ */
const MAT={massif:{nom:'bois massif',chant:false,fin:'vernis',flex:80},cp:{nom:'contreplaqué',chant:false,fin:'vernis',flex:80},
  mdf:{nom:'MDF',chant:false,fin:'peinture',flex:60},mela:{nom:'aggloméré mélaminé',chant:true,fin:null,flex:65},osb:{nom:'OSB',chant:false,fin:'vernis',flex:70}};
const MATS=[['cp','Contreplaqué'],['massif','Bois massif (pin, lamellé-collé)'],['mela','Aggloméré mélaminé'],['mdf','MDF'],['osb','OSB']];
const ASS=S('as','Assemblage',[['vis','Vis'],['tour','Tourillons (chevilles bois) et colle']],'vis');
function mDims(o){ return [N('H','Hauteur','cm',o.H),N('W','Largeur','cm',o.W),N('D','Profondeur','cm',o.D),N('e','Épaisseur des planches','mm',o.e||18),S('mat','Matériau',MATS,o.mat||'cp')]; }
function visDe(e){ const L=[30,35,40,45,50,60,70,80].find(x=>x>=2.5*e)||80; return `${e<=19?4:e<=25?5:6} × ${L} mm`; }
function kJ(D){ return D<=300?2:D<=450?3:4; }
function porteeMax(mat,e){ return Math.round(MAT[mat].flex*10*Math.pow(e/18,0.75)); }
function charn(h){ return h<=900?2:h<=1600?3:h<=2000?4:5; }
function mm(x){ return fr(Math.round(x),0); }
/* R : pieces [{nom,q,L,l,e,t:'p'|'f'|'m'|'t',sec,ch,note}], q (quincaillerie {libellé:nb}), vue (svg), notes, warns, portee, v */
function meuble(v,R){
  const P=R.pieces.filter(p=>p.q>0&&p.L>0&&p.l>0), mat=MAT[v.mat]||MAT.cp, W=[...(R.warns||[])], notes=[...(R.notes||[])];
  const rows=P.map(p=>`<tr><td>${p.nom}${p.note?`<br><span class="u">${p.note}</span>`:''}</td><td>${p.q}</td><td>${p.t==='t'?mm(p.L)+' mm':p.t==='m'?`${mm(p.L)} mm<br><span class="u">section ${p.sec}</span>`:`${mm(p.L)} × ${mm(p.l)}`}</td><td>${p.t==='m'||p.t==='t'?'—':p.e+' mm'}</td></tr>`).join('');
  const surf={}; P.filter(p=>p.t==='p'||p.t==='f').forEach(p=>{ const k=p.t==='f'?`Fond (contreplaqué ou HDF) ${p.e} mm`:`Panneaux ${p.e} mm`; surf[k]=(surf[k]||0)+p.q*p.L*p.l/1e6; });
  const lin={}; P.filter(p=>p.t==='m'||p.t==='t').forEach(p=>{ const k=p.t==='t'?`Tasseaux ${p.sec}`:`Bois massif ${p.sec}`; lin[k]=(lin[k]||0)+p.q*p.L/1000; });
  if(R.portee && v.mat){ const mx=porteeMax(v.mat,R.ep||v.e); if(R.portee>mx) W.push(`Tablettes longues de ${mm(R.portee/10)} cm sans appui : en ${mat.nom} de ${R.ep||v.e} mm, ne dépassez pas environ ${mm(mx/10)} cm pour des livres. Ajoutez un montant au milieu ou prenez des planches plus épaisses.`); }
  const ch=mat.chant ? P.reduce((s,p)=>s+(p.ch?p.q*p.ch:0),0)/1000*1.1 : 0;
  const peint=P.filter(p=>p.t==='p'||p.t==='m').reduce((s,p)=>s+p.q*(p.t==='m'?p.L*0.3:2*p.L*p.l)/1e6,0);
  const q=Object.entries(R.q||{}).filter(([,n])=>n>0);
  if(ch) q.push([`Bande de chant (rouleau)`,`${fr(ch,1)} m`]);
  if(mat.fin==='vernis') q.push(['Vernis ou huile (2 couches)',`${fr(Math.max(0.25,peint*2/12),2)} L pour ${fr(peint,1)} m²`]);
  if(mat.fin==='peinture') q.push(['Sous-couche puis peinture (2 couches)',`${fr(Math.max(0.25,peint*3/10),2)} L pour ${fr(peint,1)} m²`]);
  const dec={p:[],t:[]}; P.filter(p=>p.t==='p'&&p.e===(R.ep||v.e)).forEach(p=>dec.p.push([Math.round(p.L),Math.round(p.l),p.q])); P.filter(p=>p.t==='t').forEach(p=>dec.t.push([Math.round(p.L),p.q]));
  const nb=P.reduce((s,p)=>s+p.q,0);
  const extra=`${R.vue||''}
    <div class="tab-g"><b>Liste de débit</b><div class="tbl"><table><thead><tr><th>Pièce</th><th>Qté</th><th>Dimensions (mm)</th><th>Épaisseur</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="tab-g"><b>Quincaillerie et fournitures</b><ul>${q.map(([k,n])=>`<li>${k} : ${typeof n==='number'?fr(n,0):n}</li>`).join('')}</ul></div>
    <div class="row">${dec.p.length?`<button class="btn ghost" type="button" data-dec="p">Voir le plan de découpe des panneaux</button>`:''}${dec.t.length?`<button class="btn ghost" type="button" data-dec="t">Voir la découpe des tasseaux</button>`:''}</div>
    ${R.m3d?notice(R.m3d):''}
    <div class="tab-notes"><b>Bon à savoir</b><ul>${notes.map(n=>`<li>${n}</li>`).join('')}
      <li>Les longueurs tiennent compte de l’épaisseur des autres planches : tout s’emboîte si les coupes sont justes. Faites couper les panneaux en magasin si possible.</li>
      ${R.vis!==false?`<li>Avant chaque vis : avant-trou de 3 mm et fraisage de la tête. Vissez à 5 cm des bouts, puis tous les 15 à 20 cm.</li>`:''}</ul></div>`;
  const det=[...Object.entries(surf).map(([k,s])=>`${k} : ${fr(s,2)} m²`),...Object.entries(lin).map(([k,l])=>`${k} : ${fr(l,2)} m linéaires`),...(R.info||[]),...W.map(w=>({warn:w}))];
  const items=[...Object.entries(surf).map(([k,s])=>`${R.titre} — ${k} : ${fr(s,2)} m² (voir liste de débit)`),...Object.entries(lin).map(([k,l])=>`${R.titre} — ${k} : ${fr(l,1)} m`),...q.map(([k,n])=>`${R.titre} — ${k} : ${typeof n==='number'?fr(n,0):n}`)];
  return {big:`${nb} pièce${nb>1?'s':''} à débiter`, detail:det, extra, item:items, decoupe:dec};
}
function vue(Wt,Ht,rects,o={}){
  const m=Math.max(Wt,Ht), pad=m*0.1, fs=m/20, Y=y=>-y;
  const r=rects.map(x=>x.poly?`<polygon class="${x.cl}" points="${x.poly.map(p=>p[0]+','+Y(p[1])).join(' ')}"/>`:x.path?`<path class="${x.cl}" d="${x.path}"/>`
    :`<rect class="${x.cl}" x="${x.x}" y="${Y(x.y+x.h)}" width="${x.w}" height="${x.h}"/>`).join('');
  return `<svg class="mv" viewBox="${-pad-fs} ${-Ht-pad} ${Wt+2*pad+fs*1.2} ${Ht+2*pad+fs*1.4}" role="img" aria-label="${o.titre||'Dessin du meuble'}">
    ${o.sol!==false?`<path class="mv-sol" d="M${-pad} 0H${Wt+pad}"/>`:''}${r}
    ${o.cw!==false?`<path class="mv-cote" d="M0 ${fs*0.9}H${Wt}M0 ${fs*0.5}V${fs*1.3}M${Wt} ${fs*0.5}V${fs*1.3}"/><text x="${Wt/2}" y="${fs*2.1}" font-size="${fs}" text-anchor="middle">${o.lw||mm(Wt/10)+' cm'}</text>`:''}
    ${o.ch!==false?`<path class="mv-cote" d="M${-fs*0.9} 0V${-Ht}M${-fs*1.3} 0H${-fs*0.5}M${-fs*1.3} ${-Ht}H${-fs*0.5}"/><text x="${-fs*1.3}" y="${-Ht/2}" font-size="${fs}" text-anchor="middle" transform="rotate(-90 ${-fs*1.3} ${-Ht/2})" dy="-0.3em">${o.lh||mm(Ht/10)+' cm'}</text>`:''}
    ${(o.txt||[]).map(t=>`<text x="${t[0]}" y="${Y(t[1])}" font-size="${fs*(t[3]||0.8)}" text-anchor="middle" class="mv-t">${t[2]}</text>`).join('')}
  </svg>`;
}
function addQ(Q,k,n){ if(n>0) Q[k]=(Q[k]||0)+n; }
function joints(Q,v,nb,D){ if(v.as==='tour'){ addQ(Q,'Tourillons Ø 8 × 40 mm',nb*kJ(D)); addQ(Q,'Colle à bois vinylique (flacon)',1); } else addQ(Q,`Vis à bois ${visDe(v.e)}`,nb*kJ(D)); }
function fondQ(Q,fond,Hf,Wf,traverses){ if(fond==='cloue'){ addQ(Q,'Pointes 1,4 × 20 mm (ou vis 3 × 16)',Math.ceil(2*(Hf+Wf)/100)+Math.ceil(traverses*Wf/150)); } }
function caisson(v,o){
  const H=v.H*10,W=v.W*10,D=v.D*10,e=v.e,so=Math.max(0,(v.so||0)*10),n=Math.max(0,Math.round(v.n)),fe=3,np=+(v.np||0),fond=v.fond||'cloue';
  const Li=W-2*e, P=[], Q={}, notes=[];
  P.push({nom:'Côté',q:2,L:H,l:D,e,t:'p',ch:H});
  P.push({nom:'Dessus',q:1,L:Li,l:D,e,t:'p',ch:Li});
  P.push({nom:'Dessous',q:1,L:Li,l:D,e,t:'p',ch:Li,note:so?`posé à ${mm(so/10)} cm du sol`:''});
  if(so) P.push({nom:'Plinthe (socle)',q:1,L:Li,l:so,e,t:'p',ch:Li,note:'en retrait de 1 cm sous le dessous'});
  const off = fond==='rainure'? 10+fe : 0, mob=!o.fixes;
  const Lt=mob?Li-2:Li, Dt=D-off-(mob?10:0)-(np?0:0);
  if(n) P.push({nom:o.fixes?'Tablette fixe':'Tablette mobile',q:n,L:Lt,l:Dt,e,t:'p',ch:Lt,note:mob?'2 mm de jeu en largeur, 1 cm en retrait à l’avant':''});
  if(fond==='cloue') P.push({nom:'Fond',q:1,L:H-so,l:W,e:fe,t:'f',note:'cloué au dos, sur les chants'});
  if(fond==='rainure'){ P.push({nom:'Fond',q:1,L:H-so-2*e+16,l:Li+16,e:fe,t:'f',note:'glissé dans une rainure de 8 mm'}); notes.push(`Rainure pour le fond : largeur ${fe+0.5} mm, profondeur 8 mm, à 10 mm du bord arrière, dans les côtés, le dessus et le dessous.`); }
  let hd=0,wd=0;
  if(np){ hd=H-so-4; wd=(W-3-(np-1)*3)/np; P.push({nom:'Porte',q:np,L:hd,l:wd,e,t:'p',ch:2*(hd+wd),note:'en applique, 2 à 3 mm de jeu'}); }
  const hi=H-so-2*e, gap=n?(hi-n*e)/(n+1):hi;
  joints(Q,v,4+(o.fixes?2*n:0),D); if(so) addQ(Q,v.as==='tour'?'Tourillons Ø 8 × 40 mm':`Vis à bois ${visDe(e)}`,4);
  if(mob) addQ(Q,'Taquets de tablette (Ø 5 mm)',4*n);
  fondQ(Q,fond,H-so,W,0);
  if(np){ addQ(Q,'Charnières invisibles Ø 35 mm avec embases',np*charn(hd)); addQ(Q,'Poignées ou boutons',np); addQ(Q,'Butées ou aimants de porte',np); notes.push('Charnières : perçage Ø 35 mm, profondeur 12 mm, à 22 mm du bord de la porte, à 10 cm du haut et du bas.'); }
  if(H>=1000||o.mur){ addQ(Q,'Équerres anti-basculement',2); addQ(Q,'Vis et chevilles adaptées au mur',4); notes.push('Fixez toujours un meuble haut au mur : il peut basculer s’il est chargé en haut ou si un enfant s’y accroche.'); }
  if(mob) notes.push('Trous de taquets : Ø 5 mm, 12 mm de profondeur, à 4 cm de l’avant et de l’arrière, tous les 32 mm.');
  const R=[{cl:'mv-p',x:0,y:0,w:e,h:H},{cl:'mv-p',x:W-e,y:0,w:e,h:H},{cl:'mv-p',x:e,y:H-e,w:Li,h:e},{cl:'mv-p',x:e,y:so,w:Li,h:e}];
  if(so) R.push({cl:'mv-m',x:e,y:0,w:Li,h:so});
  for(let i=1;i<=n;i++) R.push({cl:'mv-p',x:e,y:so+e+i*gap+(i-1)*e,w:Li,h:e});
  for(let i=0;i<np;i++) R.push({cl:'mv-d',x:1.5+i*(wd+3),y:so+2,w:wd,h:hd});
  const M3=(()=>{ const k=kJ(D), Z=zs(50,D-50,k), pc={}; const as3=v.as==='tour'?'tourillons Ø 8 × 40 et colle':'vis '+visDe(e);
    pc.cg=B3('cg',0,0,0,e,H,D,'p'); pc.cd=B3('cd',W-e,0,0,e,H,D,'p'); pc.des=B3('des',e,so,0,Li,e,D,'p'); pc.dsu=B3('dsu',e,H-e,0,Li,e,D,'p');
    if(so) pc.pl=B3('pl',e,0,D-10-e,Li,so,e,'p');
    if(fond==='cloue') pc.fo=B3('fo',0,so,-fe,W,H-so,fe,'f'); if(fond==='rainure') pc.fo=B3('fo',e-8,so+e-8,10,Li+16,H-so-2*e+16,fe,'f');
    const tz=fond==='rainure'?10+fe:0, tb=[], ty=[];
    for(let i=1;i<=n;i++){ const id='t'+i, y=so+e+i*gap+(i-1)*e; pc[id]=B3(id,mob?e+1:e,y,tz,Lt,e,Dt,'p'); tb.push(id); ty.push(y); }
    const po=[]; for(let i=0;i<np;i++){ const id='po'+i; pc[id]=B3(id,1.5+i*(wd+3),so+2,D,wd,hd,e,'d'); po.push(id); }
    const vs=y=>Z.map(z=>[W,y,z]);
    const st=[{t:'Côtés et dessous',x:`Posez le dessous entre les deux côtés, à ${mm(so/10)} cm du bas. Fixez-le de chaque côté avec ${k} ${as3}.`,add:['cg','cd','des'],vis:vs(so+e/2)},
      {t:'Dessus',x:`Posez le dessus entre les côtés, à fleur du haut : ${k} ${as3} de chaque côté.`,add:['dsu'],vis:vs(H-e/2)}];
    if(so) st.push({t:'Plinthe',x:'Fixez la plinthe sous le dessous, en retrait de 1 cm : 2 vis de chaque côté.',add:['pl'],vis:[[W,so*0.3,D-10-e/2],[W,so*0.7,D-10-e/2]]});

/* Repère : x vers la droite (largeur), y vers le haut, z vers l'avant (z = 0 contre le mur). Vue de face, de droite et d'au-dessus. */
const ISOV=(()=>{ const t=-35*Math.PI/180, p=25*Math.PI/180; return {ct:Math.cos(t),st:Math.sin(t),cp:Math.cos(p),sp:Math.sin(p)}; })();

function sol3(faces){ const all=faces.flat(); return {faces,c:[0,1,2].map(i=>all.reduce((s,p)=>s+p[i],0)/all.length)}; }
function B3(id,x,y,z,w,h,d,cl){ const P=(a,b,c)=>[x+a*w,y+b*h,z+c*d];
  return {id,cl,...sol3([[P(0,0,0),P(1,0,0),P(1,1,0),P(0,1,0)],[P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1)],[P(0,0,0),P(0,0,1),P(0,1,1),P(0,1,0)],
    [P(1,0,0),P(1,0,1),P(1,1,1),P(1,1,0)],[P(0,0,0),P(1,0,0),P(1,0,1),P(0,0,1)],[P(0,1,0),P(1,1,0),P(1,1,1),P(0,1,1)]])}; }
function PY3(id,poly,y0,h,cl){ const b=poly.map(([x,z])=>[x,y0,z]), t=poly.map(([x,z])=>[x,y0+h,z]), f=[b,t];

/* Ordre de dessin : une pièce entièrement à gauche, derrière ou en dessous d'une autre (et qui la chevauche à l'écran) est dessinée avant elle */
function ordre3(ps){

    return {p,k:p.cl==='mur'?-1e9:prof(p.c),mn:[0,1,2].map(i=>Math.min(...all.map(q=>q[i]))),mx:[0,1,2].map(i=>Math.max(...all.map(q=>q[i]))),
      sx:[Math.min(...sc.map(q=>q[0])),Math.max(...sc.map(q=>q[0]))],sy:[Math.min(...sc.map(q=>q[1])),Math.max(...sc.map(q=>q[1]))]}; });
  const n=it.length, avant=Array.from({length:n},()=>[]), deg=new Array(n).fill(0), E=0.5;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){ const A=it[a], Bb=it[b];
    if(A.sx[1]<=Bb.sx[0]+E||Bb.sx[1]<=A.sx[0]+E||A.sy[1]<=Bb.sy[0]+E||Bb.sy[1]<=A.sy[0]+E) continue;
    let o=0; for(const i of [0,2,1]){ if(A.mx[i]<=Bb.mn[i]+E){ o=1; break; } if(Bb.mx[i]<=A.mn[i]+E){ o=-1; break; } }
    if((A.p.sur||[]).includes(Bb.p.id)) o=-1; if((Bb.p.sur||[]).includes(A.p.id)) o=1;
    if(A.p.cl==='mur'&&Bb.p.cl!=='mur') o=1; if(Bb.p.cl==='mur'&&A.p.cl!=='mur') o=-1;
    if(o===1){ avant[a].push(b); deg[b]++; } else if(o===-1){ avant[b].push(a); deg[a]++; } }

    pret.sort((x,y)=>it[x].k-it[y].k); const i=pret.shift(); if(fait[i]) continue; fait[i]=true; res.push(it[i]);

function isoSVG(pieces,o={}){
  const L=[-0.35,0.85,0.45], nl=Math.hypot(...L), pts=[], out=[];
  const tri=ordre3(pieces.filter(Boolean));
  for(const {p} of tri){ const fs=[];
    for(const f of p.faces){
      let n=v3x(v3s(f[1],f[0]),v3s(f[2],f[0])); const fc=[0,1,2].map(i=>f.reduce((s,q)=>s+q[i],0)/f.length);
      if(v3d(n,v3s(fc,p.c))<0) n=n.map(x=>-x);
      const nn=Math.hypot(...n)||1; n=n.map(x=>x/nn);
      if(prof(n)<=1e-6) continue;
      const [h,s,l0]=TEINTE[p.nouv?'n':p.cl]||TEINTE.p, l=Math.max(22,Math.min(93,l0+(v3d(n,L)/nl-0.35)*24));

    }
    fs.sort((a,b)=>a.k-b.k).forEach(f=>out.push(`<path d="${f.d}" fill="${f.fill}" class="iso-f${p.nouv?' iso-n':''}"/>`));
  }

  let x0=Math.min(...pts.map(q=>q[0])), x1=Math.max(...pts.map(q=>q[0])), y0=Math.min(...pts.map(q=>q[1])), y1=Math.max(...pts.map(q=>q[1]));
  const S=Math.max(x1-x0,y1-y0), fs=S*0.045; let cot='';
  if(o.cotes){ const {W,H,D}=o.cotes, g=Math.max(W,H,D)*0.07, ln=(a,b)=>{ const A=pj(a),Bq=pj(b); pts.push(A,Bq); return `<path class="iso-c" d="M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${Bq[0].toFixed(1)} ${Bq[1].toFixed(1)}"/>`; };
    const tx=(q,t,an)=>{ const A=pj(q); pts.push([A[0]+(an==='end'?-fs*4:an==='start'?fs*4:0),A[1]+fs]); return `<text x="${A[0].toFixed(1)}" y="${A[1].toFixed(1)}" font-size="${fs.toFixed(1)}" text-anchor="${an||'middle'}" dominant-baseline="middle">${t}</text>`; };
    cot=ln([0,0,D+g],[W,0,D+g])+ln([0,0,D],[0,0,D+g*1.3])+ln([W,0,D],[W,0,D+g*1.3])
      +ln([W+g,0,0],[W+g,0,D])+ln([W,0,0],[W+g*1.3,0,0])+ln([W,0,D],[W+g*1.3,0,D])
      +ln([-g,0,D],[-g,H,D])+ln([0,0,D],[-g*1.3,0,D])+ln([0,H,D],[-g*1.3,H,D])
      +tx([W/2,0,D+g*2.4],mm(W/10)+' cm')+tx([W+g*1.6,0,D/2],mm(D/10)+' cm','start')+tx([-g*1.6,H/2,D],mm(H/10)+' cm','end');
  }
  const vis=(o.vis||[]).map(q=>{ const A=pj(q); return `<circle class="iso-v" cx="${A[0].toFixed(1)}" cy="${A[1].toFixed(1)}" r="${(S*0.017).toFixed(1)}"/>`; }).join('');

}
function notice(M){

    return `<div class="nt-s"><b>Étape ${i+1} : ${s.t}</b>${isoSVG(ps,{vis:s.vis,titre:'Étape '+(i+1)})}<p>${s.x}</p></div>`; }).join('');
  return `<div class="notice"><h3>Notice de montage</h3><div class="nt-fin">${fin}</div>
    <p class="nt-leg"><span class="nt-b"></span>pièce à poser à cette étape <span class="nt-r"></span>vis visibles sur le dessin (celles de l’autre côté se posent de la même façon)</p>

}

      for(let k=0;k<4;k++){ wmh=wm/Math.cos(ar); ar=Math.atan(Math.max(1,D-wm-wmh)/H); }
      const zt=wm+wmh, a=ar*180/Math.PI, Lm=H/Math.cos(ar), zf=y=>D-(D-zt)*y/H;
      if(D<=2*wm+30) warns.push('Profondeur trop faible par rapport à la largeur des montants : augmentez la profondeur au sol.');
      P.push({nom:'Montant avant (incliné)',q:2,L:Lm,l:wm,e,t:'p',ch:0,note:`les deux bouts coupés à ${fr(a,1)}° : à plat au sol, et à l’horizontale en haut`});
      P.push({nom:'Montant arrière (contre le mur)',q:2,L:H,l:wm,e,t:'p',ch:0});
      const R=[{cl:'mv-mur',x:-30,y:0,w:30,h:H+50},{cl:'mv-m',x:0,y:0,w:wm,h:H},{cl:'mv-m',poly:[[D-wmh,0],[D,0],[zt,H],[wm,H]]}];
      let poses=0; const S3=[], hmax=Math.max(150,H-e-100);
      for(let i=0;i<n;i++){ const h=150+(hmax-150)*(n>1?i/(n-1):0), d=Math.floor((zf(h+e)-5)/5)*5;
        if(d<wm+60){ warns.push(`La tablette ${i+1} serait trop étroite : réduisez le nombre de tablettes ou augmentez la profondeur.`); continue; }
        P.push({nom:`Tablette ${i+1}`,q:1,L:Lt,l:d,e,t:'p',ch:Lt,note:`à ${mm(h/10)} cm du sol, contre le mur`}); poses++; S3.push([h,d]);
        R.push({cl:'mv-p',x:0,y:h,w:d,h:e}); }
      joints(Q,v,4*poses,150); joints(Q,v,2,150); addQ(Q,'Vis et chevilles pour fixer les montants arrière au mur',4); addQ(Q,'Patins antidérapants',4);
      const M3=(()=>{ const pc={}, pol=[[D-wmh,0],[D,0],[zt,H],[wm,H]], tb=[], vs=[], as3=v.as==='tour'?'2 tourillons et de la colle':'2 vis '+visDe(e);
        pc.mur=B3('mur',-80,-10,-20,W+160,H+120,20,'mur');
        pc.ag=B3('ag',0,0,0,e,H,wm,'p'); pc.ad=B3('ad',W-e,0,0,e,H,wm,'p'); pc.mg=PX3('mg',pol,0,e,'p'); pc.md=PX3('md',pol,W-e,e,'p');
        S3.forEach(([h,d],i)=>{ const id='t'+i; pc[id]=B3(id,e,h,0,Lt,e,d,'p'); tb.push(id); vs.push([W,h+e/2,wm/2],[W,h+e/2,zf(h+e/2)-wmh/2]); });
        return {pc,st:[
          {t:'Côtés',x:`Posez chaque montant incliné contre son montant arrière, en haut, les deux bouts à fleur : une vis en biais ou un tourillon. Les tablettes rendront ensuite chaque côté rigide.`,add:['ag','ad','mg','md'],vis:[[W,H-wm*0.6,wm+wmh*0.4]]},
          {t:'Tablettes',x:`Glissez chaque tablette entre les deux côtés, contre le mur et bien de niveau. Fixez-la devant dans le montant incliné et derrière dans le montant droit : ${as3} à chaque fois, des deux côtés.`,add:tb,vis:vs},
          {t:'Fixation au mur',x:'Posez des patins sous les 4 montants, mettez l’étagère contre le mur et vissez les deux montants arrière au mur, en haut et à mi-hauteur.',add:['mur'],vis:[]}],cotes:{W,H,D}}; })();
      return meuble(v,{m3d:M3,titre:'Étagère échelle',pieces:P,q:Q,warns,portee:Lt,info:[`Inclinaison des montants avant : ${fr(a,1)}° par rapport à la verticale`,`Longueur des montants avant : ${mm(Lm/10)} cm`],
        notes:['Chaque tablette est tenue à ses deux bouts, devant et derrière, des deux côtés : elle ne travaille pas en porte-à-faux.','Fixez toujours les montants arrière au mur : une étagère échelle non fixée peut glisser ou basculer.'],
        vue:vue(D,H,R,{titre:'Étagère échelle vue de côté',lw:mm(D/10)+' cm'})}); }},
  'm-casier':{nom:'Casier de rangement', aide:'Un meuble à cases régulières, à empiler ou à poser.',
    pic:'<rect x="8" y="8" width="32" height="32"/><path d="M8 19h32M8 29h32M19 8v32M29 8v32"/>',
    champs:[...mDims({H:105,W:105,D:35}),N('r','Nombre de rangées','',3),N('c','Nombre de colonnes','',3),ASS,
      S('fond','Fond',[['aucun','Sans fond'],['cloue','Fond cloué au dos (3 mm)']],'aucun')],
    calc(v){ const H=v.H*10,W=v.W*10,D=v.D*10,e=v.e,r=Math.max(1,Math.round(v.r)),c=Math.max(1,Math.round(v.c)),Q={},P=[];
      const hi=H-2*e, wc=(W-2*e-(c-1)*e)/c, hc=(hi-(r-1)*e)/r;
      P.push({nom:'Dessus et dessous',q:2,L:W,l:D,e,t:'p',ch:W},{nom:'Côté',q:2,L:hi,l:D,e,t:'p',ch:hi});
      if(c>1) P.push({nom:'Séparation verticale',q:c-1,L:hi,l:D,e,t:'p',ch:hi});
      if(r>1) P.push({nom:'Tablette',q:(r-1)*c,L:wc,l:D,e,t:'p',ch:wc});
      if(v.fond==='cloue') P.push({nom:'Fond',q:1,L:H,l:W,e:3,t:'f'});
      joints(Q,v,2*(c+1)+2*(r-1)*c,D); fondQ(Q,v.fond,H,W,r-1);
      const R=[{cl:'mv-p',x:0,y:0,w:W,h:e},{cl:'mv-p',x:0,y:H-e,w:W,h:e},{cl:'mv-p',x:0,y:e,w:e,h:hi},{cl:'mv-p',x:W-e,y:e,w:e,h:hi}];
      for(let j=1;j<c;j++) R.push({cl:'mv-p',x:e+j*wc+(j-1)*e,y:e,w:e,h:hi});
      for(let j=0;j<c;j++) for(let i=1;i<r;i++) R.push({cl:'mv-p',x:e+j*(wc+e),y:e+i*hc+(i-1)*e,w:wc,h:e});
      const M3=(()=>{ const pc={}, k=kJ(D), Z=zs(40,D-40,k), sv=[], tb=[];
        pc.des=B3('des',0,0,0,W,e,D,'p'); pc.dsu=B3('dsu',0,H-e,0,W,e,D,'p'); pc.cg=B3('cg',0,e,0,e,hi,D,'p'); pc.cd=B3('cd',W-e,e,0,e,hi,D,'p');
        for(let j=1;j<c;j++){ const id='s'+j; pc[id]=B3(id,e+j*wc+(j-1)*e,e,0,e,hi,D,'p'); sv.push(id); }
        for(let j=0;j<c;j++) for(let i=1;i<r;i++){ const id='t'+i+'_'+j; pc[id]=B3(id,e+j*(wc+e),e+i*hc+(i-1)*e,0,wc,e,D,'p'); tb.push(id); }
        if(v.fond==='cloue') pc.fo=B3('fo',0,0,-3,W,H,3,'f');
        const xs=[e/2,...sv.map((id,j)=>e+(j+1)*wc+j*e+e/2),W-e/2];
        const st=[{t:c>1?'Dessous, côtés et séparations':'Dessous et côtés',x:`Vissez les côtés${c>1?' et les séparations verticales':''} sur le dessous, par-dessous : ${k} vis par pièce.`,add:['des','cg','cd',...sv],vis:[]}];
        if(tb.length) st.push({t:'Tablettes',x:'Fixez les tablettes entre les séparations, avec des vis en biais ou des tourillons et de la colle.',add:tb,vis:[]});
        st.push({t:'Dessus',x:`Posez le dessus et vissez-le dans chaque côté${c>1?' et chaque séparation':''} : ${k} vis par pièce.`,add:['dsu'],vis:xs.flatMap(x=>Z.map(z=>[x,H,z]))});
        if(pc.fo) st.push({t:'Fond',x:'Mettez d’équerre et clouez le fond tous les 10 cm.',add:['fo'],vis:[]});
        return {pc,st,cotes:{W,H,D}}; })();
      return meuble(v,{m3d:M3,titre:'Casier',pieces:P,q:Q,portee:wc,info:[`Taille d’une case : ${fr(wc/10,1)} × ${fr(hc/10,1)} cm`],
        notes:['Les tablettes intérieures se vissent de biais ou se montent sur tourillons, car on ne peut pas visser des deux côtés au même endroit.'],
        vue:vue(W,H,R,{titre:'Casier vu de face'})}); }},

      S('forme','Forme',[['tri','Triangle'],['quart','Quart de cercle']],'tri'),N('n','Nombre de tablettes','',4),N('ec','Écart entre deux tablettes','cm',30),
      N('e','Épaisseur des planches','mm',18),S('mat','Matériau',MATS,'cp'),
      S('mur','Type de mur',[['plein','Béton ou brique pleine'],['creux','Brique creuse ou parpaing'],['placo','Plaque de plâtre (placo)']],'plein')],
    calc(v){ const tri=v.forme==='tri', L1=v.L1*10, L2=tri?v.L2*10:v.L1*10, e=v.e, n=Math.max(1,Math.round(v.n)), Q={}, P=[], notes=[];
      if(tri) P.push({nom:'Panneau à couper en diagonale',q:Math.ceil(n/2),L:L1,l:L2,e,t:'p',ch:Math.hypot(L1,L2)*2,note:'donne 2 tablettes triangulaires'+(n%2?' (une restera en trop)':'')});
      else P.push({nom:'Carré à découper en quart de cercle',q:n,L:L1,l:L1,e,t:'p',ch:Math.PI*L1/2,note:`rayon ${mm(L1/10)} cm, tracé au compas depuis le coin`});
      const t1=L1-20, t2=L2-20-27;
      P.push({nom:'Tasseau (mur de gauche)',q:n,L:t1,l:40,t:'t',sec:'27 × 40'},{nom:'Tasseau (mur de droite)',q:n,L:t2,l:40,t:'t',sec:'27 × 40'});
      const ch={plein:'chevilles nylon Ø 6',creux:'chevilles pour brique creuse Ø 6',placo:'chevilles métalliques à expansion Ø 6'}[v.mur];
      const k=n*(Math.ceil(t1/250)+1+Math.ceil(t2/250)+1); addQ(Q,`Vis Ø 5 × 60 + ${ch}`,k); addQ(Q,'Vis à bois 4 × 40 mm (tablette sur tasseau)',k);
      notes.push('Les deux murs d’un angle ne sont pas toujours à 90° : présentez une tablette en carton avant de couper le bois.');
      const R=[{cl:'mv-mur',x:-30,y:0,w:30,h:L2+30},{cl:'mv-mur',x:-30,y:-30,w:L1+30,h:30}];
      R.push(tri?{cl:'mv-p',poly:[[0,0],[L1,0],[0,L2]]}:{cl:'mv-p',path:`M0 0H${L1}A${L1} ${L1} 0 0 0 0 ${-L1}Z`});
      R.push({cl:'mv-m',x:0,y:0,w:t1,h:27},{cl:'mv-m',x:0,y:27,w:27,h:t2});
      const M3=(()=>{ const pc={}, ecm=v.ec*10, Ht3=(n-1)*ecm+e, ta=[], tb=[], vs=[];

        const poly=tri?[[0,0],[L1,0],[0,L2]]:[[0,0],...Array.from({length:13},(_,i)=>{ const t=i/12*Math.PI/2; return [L1*Math.cos(t),L1*Math.sin(t)]; })];
        for(let i=0;i<n;i++){ const y=i*ecm, a='a'+i, b='b'+i, id='t'+i; pc[a]=B3(a,0,y-40,0,t1,40,27,'m'); pc[b]=B3(b,0,y-40,27,27,40,t2,'m'); ta.push(a,b);
          pc[id]=PY3(id,poly,y,e,'p'); tb.push(id); zs(40,t1-40,Math.ceil(t1/250)+1).forEach(x=>vs.push([x,y-20,27])); }
        return {pc,st:[{t:'Tasseaux',x:'Tracez au niveau la hauteur de chaque tablette sur les deux murs, puis fixez les tasseaux avec vis et chevilles.',add:['m1','m2',...ta],vis:vs},
          {t:'Tablettes',x:'Posez chaque tablette sur ses deux tasseaux et vissez-la par-dessus.',add:tb,vis:[]}],cotes:{W:L1,H:Ht3,D:L2}}; })();
      return meuble(v,{m3d:M3,titre:'Étagère d’angle',pieces:P,q:Q,notes,info:[`Hauteur totale : ${mm(((n-1)*v.ec*10+e)/10)} cm`],
        vue:vue(L1,L2,R,{titre:'Étagère d’angle vue de dessus',sol:false,lw:mm(L1/10)+' cm',lh:mm(L2/10)+' cm',txt:[[L1*0.3,L2*0.25,'vue de dessus',0.7]]})}); }},
  'm-etabli':{nom:'Établi', aide:'Un plan de travail solide sur 4 pieds en bois massif, avec étagère basse.',

      S('pl','Plateau',[['2x18','Deux panneaux de 18 mm collés'],['1x30','Un panneau de 30 mm'],['m40','Bois massif 40 mm']],'2x18'),
      S('sp','Section des pieds',[['70','70 × 70 mm'],['90','90 × 90 mm']],'70'),N('dep','Débord du plateau','cm',5),
      C('basse','Étagère basse',true),S('mat','Matériau des panneaux',MATS,'cp')],

      const hp=H-ep, cl=W-2*dep+54, cc=D-2*dep, ext=D-2*dep+54;

      addQ(Q,'Vis à bois 6 × 80 mm (ceintures et traverses)',32); addQ(Q,'Équerres 40 mm pour fixer le plateau',8); addQ(Q,'Vis à bois 4 × 30 mm (équerres)',32);

      const x0=dep-27, R=[{cl:'mv-p',x:0,y:hp,w:W,h:ep},{cl:'mv-m',x:dep,y:0,w:sp,h:hp},{cl:'mv-m',x:W-dep-sp,y:0,w:sp,h:hp},

      const M3=(()=>{ const pc={}, z0=dep, z1=D-dep-sp, xL=dep, xR=W-dep-sp, yc=hp-100, lg=D-2*dep;
        [[xL,z0],[xR,z0],[xL,z1],[xR,z1]].forEach(([x,z],i)=>pc['p'+i]=B3('p'+i,x,0,z,sp,hp,sp,'m'));

        if(v.basse){ const xa=dep+sp, xb=W-dep-sp, za=dep+sp, zb=D-dep-sp; pc.eb=B3('eb',xa,220,dep-27,xb-xa,18,ext,'p');
          pc.eb2=B3('eb2',dep-27,220,za,xa-dep+27,18,zb-za,'p'); pc.eb3=B3('eb3',xb,220,za,W-dep+27-xb,18,zb-za,'p'); }
        if(v.pl==='2x18'){ pc.pl1=B3('pl1',0,hp,0,W,18,D,'p'); pc.pl2=B3('pl2',0,hp+18,0,W,18,D,'p'); } else pc.pl1=B3('pl1',0,hp,0,W,ep,D,'p');

          {t:'Ceintures et traverses longues',x:'Reliez les deux cadres avec les ceintures et traverses longues, devant et derrière, en recouvrant le bout des courtes. Vérifiez l’équerrage avant de serrer.',add:['lav','lar','tav','tar'],vis:vF}];
        if(v.basse) st.push({t:'Étagère basse',x:`Entaillez les 4 coins (${sp+27} × ${sp+27} mm) et posez l’étagère sur les traverses basses : 2 vis par traverse.`,add:['eb','eb2','eb3'],vis:[]});
        st.push({t:'Plateau',x:v.pl==='2x18'?'Collez et vissez les deux panneaux l’un sur l’autre, puis fixez le plateau sur les ceintures avec les équerres, par-dessous.':'Fixez le plateau sur les ceintures avec les équerres, par-dessous.',add:v.pl==='2x18'?['pl1','pl2']:['pl1'],vis:[]});
        return {pc,st,cotes:{W,H,D}}; })();
      return meuble({...v,e:18},{m3d:M3,titre:'Établi',pieces:P,q:Q,notes,ep:v.pl==='2x18'?18:ep,
        vue:vue(W,H,R,{titre:'Établi vu de face'})}); }},
  'm-placard':{nom:'Placard de garage', aide:'Une grande armoire à deux portes et tablettes fixes, pour ranger outils et produits.',

      const total=c*r, pas=d+15;

function PZ3(id,poly,z0,d,cl){ const a=poly.map(([x,y])=>[x,y,z0]), b=poly.map(([x,y])=>[x,y,z0+d]), f=[a,b];
  for(let i=0;i<poly.length;i++){ const j=(i+1)%poly.length; f.push([a[i],a[j],b[j],b[i]]); } return {id,cl,...sol3(f)}; }
const rond=(cx,cy,rx,ry,k=18)=>Array.from({length:k},(_,i)=>{ const t=i/k*2*Math.PI; return [cx+rx*Math.cos(t),cy+ry*Math.sin(t)]; });
const cm=x=>fr(x/10,1);
/* Nombre de longueurs du commerce (2,40 m) pour débiter les pièces en bois massif */
function barres(P,stock=2400){ const g={};
  P.filter(p=>p.t==='m'&&p.q>0).forEach(p=>{ g[p.sec]=g[p.sec]||[]; for(let i=0;i<p.q;i++) g[p.sec].push(Math.round(p.L)+4); });
  return Object.entries(g).map(([sec,ls])=>{ ls.sort((a,b)=>b-a); const b=[];
    ls.forEach(l=>{ const i=b.findIndex(r=>r+l<=Math.max(stock,l)); if(i>=0) b[i]+=l; else b.push(l); });
    const lg=ls.some(l=>l>stock);
    return `Bois ${sec} : ${b.length} longueur${b.length>1?'s':''} de ${lg?'plus de ':''}${fr(stock/1000,2)} m`; }); }
const BOIS_J=S('bois','Bois',[['pin','Pin traité autoclave classe 4'],['douglas','Douglas ou mélèze'],['robinier','Robinier (acacia)']],'pin');
const BOIS_NOTE={pin:'Pin traité autoclave classe 4 : prévu pour le contact avec la terre humide. Doublez quand même l’intérieur d’un film si vous y cultivez des légumes.',

/* Un bac de jardinière : 4 pieds 45 × 45 dans les coins, planches tout autour, 2 tasseaux et un fond à claire-voie */
function bacJ(B,k,x0,yb,y0,z0,L,Pd,e,bl,nr){
  const pc=B.pc, sp=45, Hr=nr*bl, yt=y0+Hr, n=s=>s+k, Lc=L-2*e-2*sp, Lf=Pd-2*e;
  [[x0+e,z0+e],[x0+L-e-sp,z0+e],[x0+e,z0+Pd-e-sp],[x0+L-e-sp,z0+Pd-e-sp]].forEach(([x,z],i)=>{ const id=n('p'+i+'_'); pc[id]=B3(id,x,yb,z,sp,yt-yb,sp,'m'); B.pi.push(id); });
  const ceint=y0-yb>250;
  const rang=(y,tag,arr)=>{ arr.push(...[['av',z0+Pd-e],['ar',z0]].map(([s,z])=>{ const id=n(tag+s); pc[id]=B3(id,x0,y,z,L,bl,e,'p'); return id; }),
      ...[['cg',x0],['cd',x0+L-e]].map(([s,x])=>{ const id=n(tag+s); pc[id]=B3(id,x,y,z0+e,e,bl,Lf,'p'); return id; })); };
  for(let r=0;r<nr;r++) rang(y0+r*bl,'r'+r,B.pl);
  if(ceint) rang(yb+100,'cb',B.cb);
  [['ta',z0+e],['tb',z0+Pd-e-27]].forEach(([s,z])=>{ const id=n(s); pc[id]=B3(id,x0+e+sp,y0,z,Lc,40,27,'m'); B.ta.push(id); });
  const Li=L-2*e, ns=Math.max(2,Math.floor((Li+10)/(bl+10))), gap=(Li-ns*bl)/(ns-1), yf=y0+40;
  for(let i=0;i<ns;i++){ const x=x0+e+i*(bl+gap), id=n('f'+i);
    if(i===0||i===ns-1){ const xa=i===0?x+sp:x, w=bl-sp, xi=i===0?x:x+bl-sp;
      pc[id]=B3(id,xi,yf,z0+e+sp,sp,e,Lf-2*sp,'p'); pc[id+'b']=B3(id+'b',xa,yf,z0+e,w,e,Lf,'p'); B.fd.push(id,id+'b'); }
    else { pc[id]=B3(id,x,yf,z0+e,bl,e,Lf,'p'); B.fd.push(id); } }
  B.vis.push(...[y0+bl*0.3,y0+bl*0.7].map(y=>[x0+L,y,z0+e+sp/2]),...[y0+bl*0.3,y0+bl*0.7].map(y=>[x0+L,y,z0+Pd-e-sp/2]));
  return {ns,gap,ceint,Lc,Lf,Hr,lit:(L-2*e)*(Pd-2*e)*Math.max(0,Hr-40-e)/1e6};
}
function jardiniereCalc(v,etages){
  const L=v.L*10, Pd=v.P*10, e=v.e, bl=v.bl*10, nb=etages?Math.max(1,Math.min(5,Math.round(v.n))):1;
  const nr=Math.max(1,Math.ceil(v.H*10/bl-0.15)), Hr=nr*bl, pied=etages?Math.max(0,v.hp*10):(v.pose==='pieds'?Math.max(0,v.hp*10):0), dh=etages?v.dh*10:0;
  const B={pc:{},pi:[],pl:[],cb:[],ta:[],fd:[],vis:[]}, info=[], warns=[], notes=[], Q={}, P=[];
  let lit=0, res=[];
  for(let t=0;t<nb;t++){ const z0=(nb-1-t)*Pd, y0=pied+t*dh; res.push({...bacJ(B,'_'+t,0,0,y0,z0,L,Pd,e,bl,nr),y0}); lit+=res[t].lit; }
  const r0=res[0], ncb=res.filter(r=>r.ceint).length, nf=res.reduce((s,r)=>s+r.ns,0);
  P.push({nom:'Planche de façade (devant et derrière)',q:2*nr*nb+2*ncb,L,l:bl,t:'m',sec:`${e} × ${mm(bl)}`});
  P.push({nom:'Planche de côté',q:2*nr*nb+2*ncb,L:Pd-2*e,l:bl,t:'m',sec:`${e} × ${mm(bl)}`,note:'entre les planches de façade'});
  res.forEach((r,t)=>P.push({nom:nb>1?`Pied du bac ${t+1}${t===0?' (devant)':t===nb-1?' (derrière)':''}`:'Pied (coin intérieur)',q:4,L:r.y0+Hr,l:45,t:'m',sec:'45 × 45'}));
  P.push({nom:'Tasseau support du fond',q:2*nb,L:r0.Lc,l:40,t:'m',sec:'27 × 40',note:'en bas, contre les façades, entre les pieds'});
  P.push({nom:'Latte du fond',q:nf,L:r0.Lf,l:bl,t:'m',sec:`${e} × ${mm(bl)}`,note:`écart ${cm(r0.gap)} cm pour l’eau ; les 2 lattes des bouts entaillées de 4,5 × 4,5 cm aux coins`});
  const vp=`Vis inox ou zinguées ${visDe(e)} (planches dans les pieds)`;
  addQ(Q,vp,(16*nr+(0))*nb+16*ncb);
  addQ(Q,'Vis inox ou zinguées 4 × 40 mm (tasseaux et lattes du fond)',nb*(2*(Math.ceil(r0.Lc/250)+1)+2*r0.ns));
  if(nb>1) addQ(Q,`Vis ${visDe(e)} pour relier les bacs entre eux`,4*(nb-1)*Math.max(1,Math.ceil(L/500)));
  const sGeo=nb*(L*Pd/1e6)*1.15, sFilm=nb*2*(L+Pd)*Hr/1e6*1.1;
  Q['Géotextile (feutre) pour le fond']=`${fr(sGeo,2)} m²`;
  Q['Film pour l’intérieur des côtés (bâche à excavation à picots ou polyane)']=`${fr(sFilm,2)} m²`;
  Q['Agrafes inox pour agrafeuse']='1 boîte';
  Q['Billes d’argile ou graviers (drainage, 3 à 5 cm)']=`${fr(nb*(L-2*e)*(Pd-2*e)*40/1e6,0)} L`;
  Q['Terreau']=`${fr(lit,0)} L`;
  if(pied||nb>1) addQ(Q,'Cales sous les pieds (dalles ou briques)',4*nb);
  const Wt=L, Ht=pied+(nb-1)*dh+Hr, D=nb*Pd;
  info.push(`Hauteur ${nb>1?'de chaque bac':'du bac'} : ${cm(Hr)} cm (${nr} rangée${nr>1?'s':''} de planches de ${cm(bl)} cm)`,
    `Encombrement : ${cm(L)} × ${cm(D)} cm, hauteur ${cm(Ht)} cm`,`Terre : ${fr(lit,0)} litres, soit environ ${fr(lit,0)} kg une fois arrosée`,...barres(P));
  if(L>1200) warns.push('Au-delà de 1,20 m de long, les planches peuvent se bomber sous le poids de la terre : ajoutez une paire de pieds au milieu, ou raccourcissez.');
  if(Pd>700) warns.push('Au-delà de 70 cm de large, les lattes du fond fléchissent : ajoutez un tasseau au milieu ou réduisez la largeur.');
  if(nb>1&&dh>Hr) warns.push(`Le décalage (${cm(dh)} cm) est plus grand que la hauteur d’un bac (${cm(Hr)} cm) : les bacs ne se touchent plus et ne se tiennent plus entre eux. Prenez un décalage d’au plus ${cm(Hr)} cm.`);
  notes.push(BOIS_NOTE[v.bois]||BOIS_NOTE.pin,
    'Agrafez le film sur l’intérieur des côtés seulement, jamais sur le fond : l’eau doit pouvoir s’écouler.',
    'Remplissage : géotextile sur les lattes du fond, 3 à 5 cm de billes d’argile ou de graviers, puis le terreau jusqu’à 2 cm du bord.',
    'Utilisez des vis inox (ou au moins zinguées) : des vis ordinaires rouillent et tachent le bois.');
  if(pied||nb>1) notes.push('Posez les pieds sur des dalles ou des briques, pas directement dans la terre : ils dureront beaucoup plus longtemps.');
  if(ncb) notes.push('Les pieds qui dépassent de plus de 25 cm sous un bac sont reliés par une ceinture basse de planches, à 10 cm du sol : c’est elle qui empêche l’ensemble de se déformer.');
  if(nb>1) notes.push('Mettez la jardinière à étagères de préférence contre un mur ou une clôture, le bac le plus haut derrière, et vérifiez qu’elle est bien de niveau avant de remplir.');
  // Étapes de montage
  const st=[];
  st.push({t:'Premier rang de planches',x:`Couchez les pieds sur une table et vissez le premier rang de planches tout autour, les côtés entre les façades : 2 vis ${visDe(e)} à chaque bout de planche, dans le pied.`,add:[...B.pi,...B.pl.filter(id=>/r0/.test(id))],vis:B.vis.filter((q,i)=>i%4<2)});
  if(nr>1) st.push({t:'Rangées suivantes',x:'Vissez les autres rangées de la même façon, bien jointives. Vérifiez l’équerrage : les deux diagonales du bac doivent être égales.',add:B.pl.filter(id=>!/r0/.test(id)),vis:[]});
  if(B.cb.length) st.push({t:'Ceinture basse',x:'Vissez un rang de planches à 10 cm du sol sur les pieds qui dépassent : la structure devient rigide.',add:B.cb,vis:[]});
  st.push({t:'Tasseaux et fond',x:`Vissez les 2 tasseaux à l’intérieur, en bas des façades, entre les pieds. Posez les lattes du fond dessus avec ${cm(r0.gap)} cm d’écart (les deux des bouts entaillées autour des pieds) et vissez-les : 1 vis à chaque bout. (Sur le dessin, la façade avant est retirée pour montrer l’intérieur.)`,add:[...B.ta,...B.fd],vis:[],cache:[...B.pl,...B.cb].filter(id=>/av_|av$/.test(id)||/av(_\d+)?$/.test(id))});
  if(nb>1) st.push({t:'Assemblage des bacs',x:'Placez les bacs du plus bas (devant) au plus haut (derrière), bien serrés. Vissez-les entre eux à travers les planches qui se touchent, tous les 50 cm.',add:[],vis:[]});
  st.push({t:'Film, drainage et terreau',x:'Agrafez le film à l’intérieur des côtés, posez le géotextile sur le fond, 3 à 5 cm de billes d’argile, puis le terreau.',add:[],vis:[]});
  // Dessin 2D
  const R=[];
  if(nb===1){ for(let r=0;r<nr;r++) R.push({cl:'mv-p',x:0,y:pied+r*bl,w:L,h:bl});
    if(pied){ R.push({cl:'mv-m',x:e,y:0,w:45,h:pied},{cl:'mv-m',x:L-e-45,y:0,w:45,h:pied}); if(r0.ceint) R.push({cl:'mv-p',x:0,y:100,w:L,h:bl}); }
    R.push({cl:'mv-d',x:e,y:pied+40,w:L-2*e,h:e}); }
  else res.forEach((r,t)=>{ const z0=(nb-1-t)*Pd, zv=D-z0-Pd; // vue de côté : devant à gauche
    if(r.y0>0) R.push({cl:'mv-m',x:zv+e,y:0,w:45,h:r.y0},{cl:'mv-m',x:zv+Pd-e-45,y:0,w:45,h:r.y0});
    if(r.ceint) R.push({cl:'mv-p',x:zv,y:100,w:Pd,h:bl});
    for(let k=0;k<nr;k++) R.push({cl:'mv-p',x:zv,y:r.y0+k*bl,w:Pd,h:bl});
    R.push({cl:'mv-d',x:zv+e,y:r.y0+40,w:Pd-2*e,h:e}); });
  const titre=nb>1?'Jardinière à étagères':'Jardinière';
  const out=meuble({...v,mat:'ext'},{m3d:{pc:B.pc,st,cotes:{W:Wt,H:Ht,D}},titre,pieces:P,q:Q,notes,warns,info,ep:-1,
    vue:nb>1?vue(D,Ht,R,{titre:titre+' vue de côté',lw:cm(D)+' cm',txt:[[D*0.12,-Ht*0.02,'devant',0.6]]}):vue(L,Ht,R,{titre:'Jardinière vue de face'})});
  return {...out,big:`${titre} · ${fr(lit,0)} L de terreau`};
}

  'j-nichoir':{nom:'Nichoir à oiseaux', aide:'Une boîte à toit en pente, avec un trou d’envol adapté à l’oiseau que vous voulez accueillir (mesures conseillées par la LPO).',
    pic:'<path d="M7 21L24 7l17 14"/><path d="M12 18v24h24V18"/><circle cx="24" cy="26" r="4.5"/>',
    champs:[S('oi','Oiseau à accueillir',Object.entries(OIS).map(([k,o])=>[k,o[0]]),'charbo'),N('e','Épaisseur des planches','mm',18),
      S('bois','Bois',[['sapin','Sapin ou pin brut, non traité'],['douglas','Douglas ou mélèze brut'],['cp','Contreplaqué extérieur (CTBX)']],'sapin'),
      C('plq','Plaque de protection du trou (contre les pics et les écureuils)',false,{k:'oi',v:NON_SEMI})],
    calc(v){ const o=OIS[v.oi]||OIS.charbo, semi=v.oi==='semi', e=Math.max(10,v.e), tr=o[1], int=o[2], hin=o[3], hb=o[4];
      const W=int+2*e, ta=Math.tan(15*Math.PI/180), t=e/Math.cos(15*Math.PI/180), ov=50, so=60;
      const Hb=e+hin+int*ta, yR=z=>Hb-(z-e)*ta, zf=e+int+e, zend=zf+ov, Hf=semi?e+Math.round(hin*0.45):Math.round(yR(zf)), Lt=Math.round((zend-e)/Math.cos(15*Math.PI/180)), Hd=so+Hb+t+40;
      const P=[], Q={}, warns=[];
      P.push({nom:'Dos',q:1,L:Hd,l:W,e,t:'p',note:'dépasse de 6 cm en bas et de 4 cm en haut pour le fixer'});
      P.push({nom:'Côté',q:2,L:Hb,l:int,e,t:'p',note:`haut coupé en pente : ${cm(Hb)} cm derrière, ${cm(yR(e+int))} cm devant`});
      P.push({nom:'Fond (plancher)',q:1,L:int,l:int,e,t:'p',note:'4 trous Ø 5 mm pour l’eau et l’air'});
      P.push({nom:'Façade',q:1,L:Hf,l:W,e,t:'p',note:semi?`ouverture de ${cm(yR(zf)-Hf)} cm au-dessus`:`trou d’envol Ø ${tr} mm, bas du trou à ${cm(e+hb)} cm du bas de la façade`});
      P.push({nom:'Toit',q:1,L:Lt,l:W+30,e,t:'p',note:'déborde de 5 cm devant et de 1,5 cm sur les côtés'});
      addQ(Q,`Vis inox ${visDe(e)}`,18); addQ(Q,'Charnière laiton 40 mm et ses vis (pour ouvrir le toit)',1); addQ(Q,'Crochet de fermeture',1);
      Q['Pour le fixer']='2 vis inox 5 × 60 et chevilles (mur), ou fil de fer gainé et une cale de bois (arbre)';
      if(v.plq&&!semi) addQ(Q,`Plaque métallique de 8 × 8 cm percée à Ø ${tr} mm et 4 petites vis`,1);
      Q['Huile de lin, à l’extérieur seulement (facultatif)']='1 petit flacon';
      if(e<15) warns.push('Avec moins de 15 mm, les parois isolent mal du froid et de la chaleur : la LPO conseille 2 cm (1 cm au strict minimum).');
      if(v.bois==='cp') warns.push('Choisissez un contreplaqué « extérieur » (CTBX), sinon il se délite à la pluie.');
      const lgt=Hd+2*Hb+int+Hf+Lt+25;
      const info=[semi?'Nichoir semi-ouvert (pas de trou d’envol)':`Trou d’envol : Ø ${tr} mm`,`Intérieur : ${cm(int)} × ${cm(int)} cm, hauteur ${cm(hin)} à ${cm(hin+int*ta)} cm`,
        `Hauteur de pose conseillée : ${o[5]}`,`Tout se découpe dans une planche de ${e} mm, ${cm(W+30)} cm de large et ${fr(lgt/1000,2)} m de long`];
      const pol=[[e,so],[e+int,so],[e+int,so+yR(e+int)],[e,so+Hb]], hy=so+e+hb+tr/2, pc={};
      pc.dos=B3('dos',0,0,0,W,Hd,e,'p'); pc.cg=PX3('cg',pol,0,e,'p'); pc.cd=PX3('cd',pol,W-e,e,'p');
      pc.fo=B3('fo',e,so,e,int,e,int,'p'); pc.fa=B3('fa',0,so,e+int,W,Hf,e,'p');
      if(!semi){ if(v.plq) pc.pq=PZ3('pq',[[W/2-40,hy-40],[W/2+40,hy-40],[W/2+40,hy+40],[W/2-40,hy+40]],zf,1.5,'m'); pc.tr=PZ3('tr',rond(W/2,hy,tr/2,tr/2),zf+(v.plq?1.5:0),1,'o'); }
      pc.toit=PX3('toit',[[e,so+Hb],[zend,so+yR(zend)],[zend,so+yR(zend)+t],[e,so+Hb+t]],-15,W+30,'p');
      const st=[{t:'Côtés sur le dos',x:'Posez les deux côtés sur le dos, à 6 cm du bas, la pente vers l’avant. Vissez par l’arrière du dos : 3 vis par côté.',add:['dos','cg','cd'],vis:[]},
        {t:'Fond',x:'Percez 4 trous de Ø 5 mm dans le fond. Glissez-le entre les côtés, contre le dos, et vissez à travers les côtés : 2 vis de chaque côté.',add:['fo'],vis:[[W,so+e/2,e+int*0.3],[W,so+e/2,e+int*0.7]]},
        {t:'Façade',x:semi?'Vissez la façade basse sur les côtés et le fond : 2 vis de chaque côté, 2 dans le fond. Le haut reste ouvert.'
          :`Percez le trou d’envol à la scie cloche Ø ${tr} mm, le bas du trou à ${cm(e+hb)} cm du bas. Griffez l’intérieur sous le trou (rainures à la scie) : les petits pourront grimper. Pas de perchoir ! Vissez la façade : 3 vis de chaque côté.${v.plq?' Vissez la plaque de métal autour du trou.':''}`,
          add:['fa','tr','pq'],vis:[e/2,W-e/2].flatMap(x=>(semi?[0.3,0.7]:[0.2,0.5,0.8]).map(k=>[x,so+Hf*k,zf]))},
        {t:'Toit',x:'Posez le toit contre le dos. Fixez-le avec la charnière, posée sur le dessus contre le dos : il se soulève pour le nettoyage. Fermez-le devant avec le crochet. Un léger jour sous le toit, à l’avant, aère le nichoir.',add:['toit'],vis:[]},
        {t:'Pose',x:`Fixez le nichoir par les dépassants du dos, à ${o[5]} de haut, le trou tourné vers l’est ou le sud-est, à l’abri des vents dominants, légèrement penché vers l’avant.`,add:[],vis:[]}];
      const R=[{cl:'mv-p',x:0,y:0,w:W,h:Hd},{cl:'mv-m',x:-15,y:so+yR(zend),w:W+30,h:Hb+t-yR(zend)},{cl:'mv-p',x:0,y:so,w:W,h:Hf}];
      if(!semi){ if(v.plq) R.push({cl:'mv-m',x:W/2-40,y:hy-40,w:80,h:80}); R.push({cl:'mv-b',path:`M${W/2+tr/2} ${-hy}a${tr/2} ${tr/2} 0 1 0 0 0.01z`}); }
      const out=meuble({...v,e,mat:'ext'},{m3d:{pc,st,cotes:{W,H:Hd,D:zend}},titre:'Nichoir',pieces:P,q:Q,warns,info,ep:-1,
        notes:['Bois brut, sans traitement à l’intérieur : les oiseaux y sont sensibles. Une huile de lin à l’extérieur suffit.',
          'Pas de perchoir sous le trou : il aide surtout les prédateurs.','Ne mettez rien dedans, les oiseaux s’en chargent.',
          'Posez-le dès l’automne ou au début de l’hiver, ni en plein soleil ni à l’ombre complète, hors de portée des chats.',
          'Sur un arbre : une cale de bois entre le tronc et le fil gainé, jamais de clou dans l’arbre.',
          'Nettoyez-le chaque année en septembre-octobre (videz, brossez). Ne l’ouvrez jamais pendant la nichée.',
          'S’il reste vide 2 ou 3 ans, changez-le de place.'],
        vue:vue(W,Hd,R,{titre:'Nichoir vu de face',sol:false})});
      return {...out,big:semi?'Nichoir semi-ouvert':`Nichoir · trou Ø ${tr} mm`};
    }},
  'j-mangeoire':{nom:'Mangeoire pour oiseaux', aide:'Un plateau à rebords sous un petit toit à deux pentes, à poser sur un poteau ou à suspendre.',
    pic:'<path d="M5 20L24 8l19 12"/><path d="M11 18v18M37 18v18M7 36h34v4H7z"/><path d="M24 40v6"/>',
    champs:[N('L','Longueur du plateau','cm',40),N('l','Largeur du plateau','cm',30),N('h','Hauteur sous le toit','cm',20),N('e','Épaisseur des planches','mm',18),
      S('pose','Installation',[['poteau','Sur un poteau'],['susp','Suspendue à une branche']],'poteau'),N('hpo','Hauteur du poteau hors sol','cm',150,{k:'pose',v:['poteau']})],
    calc(v){ const L=v.L*10, l=v.l*10, h=v.h*10, e=v.e, ov=40, a=30*Math.PI/180, ta=Math.tan(a), hp=l/2*ta, t=e/Math.cos(a), s=Math.round((l/2+ov)/Math.cos(a)), mt=30, gj=15;

      P.push({nom:'Plateau',q:1,L,l,e,t:'p',note:'4 trous Ø 6 mm près des coins pour l’eau'});
      P.push({nom:'Pignon',q:2,L:l,l:Math.round(hp+40),e,t:'p',note:`forme de maison : base ${cm(l)} cm, côtés droits 4 cm, pointe à ${cm(hp+40)} cm, au milieu`});
      P.push({nom:'Pan de toit',q:2,L:L+2*e+2*ov,l:s,e,t:'p',note:'déborde de 4 cm tout autour'});

      P.push({nom:'Rebord long',q:2,L:L-2*mt-2*gj,l:30,t:'m',sec:'20 × 30'},{nom:'Rebord court',q:2,L:l-2*mt-2*gj,l:30,t:'m',sec:'20 × 30',note:'1,5 cm libre à chaque coin : l’eau s’écoule'});
      if(pot){ P.push({nom:'Poteau',q:1,L:v.hpo*10,l:70,t:'m',sec:'70 × 70'}); addQ(Q,'Support de poteau à enfoncer 70 × 70',1); addQ(Q,'Équerres 50 mm (plateau sur le poteau) et leurs vis',4); }
      else addQ(Q,'Pitons à visser et chaîne ou fil inox (1 m)',2);

      const pc={}, vF=[];
      pc.pl=B3('pl',0,0,0,L,e,l,'p');
      const rb=[['r1',mt+gj,0,L-2*mt-2*gj,20],['r2',mt+gj,l-20,L-2*mt-2*gj,20]].map(([id,x,z,w,d])=>(pc[id]=B3(id,x,e,z,w,30,d,'m'),id));

      const pg=[[0,yT-40],[l,yT-40],[l,yT],[l/2,yT+hp],[0,yT]].map(([z,y])=>[z,y]);
      pc.g1=PX3('g1',pg,-e,e,'p'); pc.g2=PX3('g2',pg,L,e,'p');

      pc.t1.sur=['g1','g2',...mo]; pc.t2.sur=['g1','g2','t1',...mo];
      if(pot) pc.po=B3('po',L/2-35,-400,l/2-35,70,400,70,'m');
      const yTop=z=>yT+hp+t-Math.abs(z-l/2)*ta;
      const st=[{t:'Plateau et rebords',x:'Percez 4 trous de Ø 6 mm dans le plateau, près des coins. Vissez les rebords par-dessous (2 vis chacun) en laissant 1,5 cm libre à chaque coin : l’eau s’écoule et on balaie facilement les restes.',add:['pl',...rb],vis:[]},
        {t:'Montants',x:'Vissez les 4 montants aux coins du plateau, par-dessous : 1 vis par montant, avec de la colle extérieure.',add:mo,vis:[]},
        {t:'Pignons',x:'Vissez un pignon de chaque côté, contre le haut des montants : 2 vis par pignon, une dans chaque montant.',add:['g1','g2'],vis:[[L+e,yT-20,mt/2],[L+e,yT-20,l-mt/2]]},

          'Nettoyez le plateau chaque semaine (brosse, gants, eau claire) et jetez les graines moisies. Si vous voyez des oiseaux malades, arrêtez de nourrir pendant quelques semaines.',

  'j-jardiniere':{nom:'Jardinière simple', aide:'Un bac en planches sur 4 pieds d’angle, avec un fond à claire-voie pour que l’eau s’écoule. Au sol ou surélevé.',
