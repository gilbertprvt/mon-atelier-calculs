JARDIN['j-echelle']={nom:'Jardinière en A', aide:'Deux côtés en forme de A, comme une échelle de peintre, qui portent des bacs en auge à devant incliné. Le bac du bas avance, celui du haut recule : chaque étage a sa lumière.',
  pic:'<path d="M30 6L12 44M30 6v38"/><path d="M8 18h26l-3 6H11zM6 29h28l-3 6H9z" /><path d="M16 40h18"/>',
  champs:[N('L','Longueur des bacs','cm',80),N('H','Hauteur totale','cm',110),N('D','Profondeur au sol','cm',75),N('n','Nombre de bacs','',3),
    N('hb','Hauteur du premier bac','cm',25),N('bl','Largeur des planches','cm',14.5),N('e','Épaisseur des planches','mm',21),BOIS_J],
  calc(v){
    const e=v.e, bl=v.bl*10, n=Math.max(2,Math.min(4,Math.round(v.n))), H=v.H*10, D=v.D*10, Lb=v.L*10, W=Lb+90, rw=70, mt=45;
    const ta=H/(D-rw), a=Math.atan(ta), deg=Math.round(a*180/Math.PI), wz=rw/Math.sin(a), zf=y=>D-y/ta;
    const c30=Math.cos(Math.PI/6), t30=Math.tan(Math.PI/6), hf=bl*c30, tw=e/c30, s=hf*t30, emp=e+bl+tw;
    const hb=Math.max(200,v.hb*10), ytop=H-bl-30, dy=n>1?(ytop-hb)/(n-1):0, ys=Array.from({length:n},(_,k)=>Math.round(hb+k*dy));
    const pc={}, P=[], Q={}, warns=[], info=[], notes=[];
    // côtés en A
    const fl=[[D-wz,0],[D,0],[rw,H],[rw,(D-wz-rw)*ta]];
    [['g',0],['d',W-mt]].forEach(([c,x])=>{ pc['ar'+c]=B3('ar'+c,x,0,0,mt,H,rw,'m'); pc['av'+c]=PX3('av'+c,fl,x,mt,'m'); });
    pc.ent=B3('ent',mt,40,0,W-2*mt,70,rw,'m');
    let lit=0; const tq=[], bacs=[], visT=[];
    ys.forEach((yk,k)=>{ const zfr=zf(yk)-10, u0=zfr-tw-bl, zA=u0+bl, zc0=Math.min(0,u0-e);
      const cl=[[zc0,yk-45],[zf(yk-45),yk-45],[zf(yk),yk],[zc0,yk]];
      pc['tg'+k]=PX3('tg'+k,cl,mt,27,'m'); pc['td'+k]=PX3('td'+k,cl,W-mt-27,27,'m'); tq.push('tg'+k,'td'+k);
      visT.push([mt+27,yk-22,rw/2],[mt+27,yk-22,zf(yk)-35]);
      const jo=[[u0-e,yk],[zA+tw,yk],[zA+tw+s,yk+hf],[u0-e,yk+bl]], fb=[[zA,yk],[zA+tw,yk],[zA+tw+s,yk+hf],[zA+s,yk+hf]];
      const x1=mt, x2=W-mt, id=s=>s+k;
      pc[id('jg')]=PX3(id('jg'),jo,x1,e,'p'); pc[id('jd')]=PX3(id('jd'),jo,x2-e,e,'p');
      pc[id('bd')]=B3(id('bd'),x1+e,yk,u0-e,Lb-2*e,bl,e,'p'); pc[id('bf')]=B3(id('bf'),x1+e,yk,u0,Lb-2*e,e,bl,'p');
      pc[id('bv')]=PX3(id('bv'),fb,x1+e,Lb-2*e,'p');
      bacs.push(id('jg'),id('jd'),id('bd'),id('bf'),id('bv'));
      const hi=hf-e; lit+=hi*(bl+hi*t30/2)*(Lb-2*e)/1e6;
      P.push({nom:`Taquet support du bac ${k+1}${k===0?' (bas)':k===n-1?' (haut)':''}`,q:2,L:Math.round(zf(yk-45)-zc0),l:45,t:'m',sec:'27 × 45',note:`bout avant coupé en biais à ${deg}°`});
      if(u0-e<0&&k===n-1) info.push(`Le bac du haut dépasse de ${cm(e-u0)} cm derrière les montants : c’est normal, il repose sur ses taquets.`);
    });
    const Lav=Math.round(Math.hypot(D-rw,H));
    P.unshift({nom:'Montant arrière (droit)',q:2,L:H,l:rw,t:'m',sec:'45 × 70'},
      {nom:'Montant avant (incliné)',q:2,L:Lav,l:rw,t:'m',sec:'45 × 70',note:`coupé en biais aux deux bouts : ${deg}° en bas (à plat sur le sol), ${90-deg}° en haut (contre le montant arrière)`},
      {nom:'Entretoise arrière',q:1,L:W-2*mt,l:rw,t:'m',sec:'45 × 70',note:'entre les deux montants arrière, à 4 cm du sol'});
    P.push({nom:'Dos de bac',q:n,L:Lb-2*e,l:bl,t:'m',sec:`${e} × ${mm(bl)}`},
      {nom:'Fond de bac',q:n,L:Lb-2*e,l:bl,t:'m',sec:`${e} × ${mm(bl)}`,note:'trous Ø 8 mm tous les 15 cm'},
      {nom:'Devant de bac (incliné)',q:n,L:Lb-2*e,l:bl,t:'m',sec:`${e} × ${mm(bl)}`,note:'chant du bas coupé à 30° pour bien poser'},
      {nom:'Joue de bac',q:2*n,L:Math.round(emp+s),l:bl,t:'m',sec:`${e} × ${mm(bl)}`,note:`trapèze : ${cm(emp)} cm en bas, ${cm(emp+s)} cm en haut ; ${cm(bl)} cm de haut derrière, ${cm(hf)} cm devant`});
    addQ(Q,`Vis inox ou zinguées ${visDe(e)} (bacs)`,n*(12+4));
    addQ(Q,'Vis inox ou zinguées 5 × 50 mm (taquets sur les montants)',8*n);
    addQ(Q,'Vis 6 × 120 mm (entretoise, haut des montants)',8);
    addQ(Q,'Équerres plates 80 mm (jonction des montants en haut) et leurs vis',2);
    Q['Géotextile (feutre) pour les fonds']=`${fr(n*(Lb*(bl+2*s))/1e6*1.1,2)} m²`;
    Q['Film pour l’intérieur des bacs (polyane)']=`${fr(n*Lb*(2*bl+2*emp)/1e6*1.1,2)} m²`;
    Q['Agrafes inox pour agrafeuse']='1 boîte';
    Q['Terreau']=`${fr(lit,0)} L`;
    addQ(Q,'Cales sous les pieds (dalles ou briques)',4);
    info.unshift(`Encombrement : ${cm(W)} cm de large, ${cm(Math.max(D,zf(ys[0]+hf)+tw+s))} cm de profondeur, ${cm(H)} cm de haut`,
      `Montant avant incliné à ${deg}° par rapport au sol`,`Bacs : ${ys.map(y=>cm(y)+' cm').join(', ')} du sol`,`Terre : ${fr(lit,0)} litres, soit environ ${fr(lit,0)} kg une fois arrosée`);
    info.push(...barres(P));
    if(D<0.55*H) warns.push(`La base est étroite (${fr(v.D,0)} cm de profondeur pour ${fr(v.H,0)} cm de haut) : la jardinière risque de basculer en avant une fois remplie. Augmentez la profondeur au sol ou fixez le haut à un mur.`);
    if(dy&&dy<bl+60) warns.push('Les bacs sont trop rapprochés en hauteur : les plantes n’auront pas de place. Diminuez le nombre de bacs ou augmentez la hauteur totale.');
    if(Lb>1200) warns.push('Au-delà de 1,20 m, les fonds de bacs fléchissent sous le poids de la terre : vissez un taquet supplémentaire sous le milieu de chaque bac.');
    notes.push(BOIS_NOTE[v.bois]||BOIS_NOTE.pin,
      'Les deux côtés sont symétriques : assemblez-les l’un sur l’autre, à plat, pour qu’ils soient identiques (taquets à l’intérieur !).',
      'Agrafez un film sur les parois intérieures des bacs, et du géotextile au fond, sans boucher les trous : l’eau doit s’écouler.',
      'Une fois remplie, la jardinière est lourde : posez-la de niveau, sur des dalles, et ne la déplacez plus. Contre un mur, vous pouvez attacher le haut avec 2 équerres.');
    const st=[{t:'Les deux côtés en A',x:`À plat sur le sol, posez le montant arrière et le montant avant (coupé à ${deg}° en bas et ${90-deg}° en haut). Vissez les ${n} taquets à l’intérieur, bien horizontaux (vérifiez au niveau) : 2 vis à chaque bout. Joignez le haut des montants avec une équerre plate. Faites le second côté en miroir.`,add:['arg','avg','ard','avd',...tq],vis:visT},
      {t:'Entretoise',x:'Mettez les deux côtés debout et vissez l’entretoise entre les montants arrière, à 4 cm du sol : 2 vis 6 × 120 par côté, à travers le montant.',add:['ent'],vis:[[W,75,rw*0.3],[W,75,rw*0.7]]},
      {t:'Les bacs',x:`Pour chaque bac : vissez le dos, le fond et le devant incliné entre les deux joues (2 vis par bout de planche). Percez des trous de Ø 8 mm dans le fond tous les 15 cm. Posez les bacs sur leurs taquets et vissez chaque joue dans son taquet : 2 vis.`,add:bacs,vis:[]},
      {t:'Film et terreau',x:'Agrafez le film sur les parois, posez le géotextile au fond, quelques billes d’argile, puis le terreau. Arrosez doucement la première fois.',add:[],vis:[]}];
    const R=[{cl:'mv-m',x:0,y:0,w:rw,h:H},{cl:'mv-m',poly:fl},{cl:'mv-m',x:0,y:40,w:rw,h:70}];
    ys.forEach(yk=>{ const u0=zf(yk)-10-tw-bl, zc0=Math.min(0,u0-e);
      R.push({cl:'mv-m',poly:[[zc0,yk-45],[zf(yk-45),yk-45],[zf(yk),yk],[zc0,yk]]},{cl:'mv-p',poly:[[u0-e,yk],[u0+bl+tw,yk],[u0+bl+tw+s,yk+hf],[u0-e,yk+bl]]}); });
    const Dt=Math.max(D,...ys.map(yk=>zf(yk)-10+s));
    const out=meuble({...v,mat:'ext'},{m3d:{pc,st,cotes:{W,H,D}},titre:'Jardinière en A',pieces:P,q:Q,notes,warns,info,ep:-1,
      vue:vue(Dt,H,R,{titre:'Jardinière en A vue de côté',lw:cm(Dt)+' cm'})});
    return {...out,big:`Jardinière en A · ${n} bacs · ${fr(lit,0)} L de terreau`};
  }};

const TOOLS = {
  /* ---------- BOIS ---------- */
  panneaux:{nom:'Découpe de panneaux', aide:'Indiquez la taille du panneau et la liste des pièces. Les découpes se font en lignes droites, comme à la scie circulaire.',
    champs:[N('W','Longueur du panneau','mm',2500),N('H','Largeur du panneau','mm',1250),N('k','Épaisseur du trait de scie','mm',3),
      C('fil','Respecter le sens du fil (ne pas tourner les pièces)',false),
      P('pcs',[['Longueur','mm'],['Largeur','mm'],['Nombre','pièces']],[[800,400,4],[600,300,6],[1200,500,2]])],
    calc(v){
      const W=v.W, H=v.H, k=v.k, list=[], trop=[];
      v.pcs.forEach(([a,b,q])=>{ for(let i=0;i<Math.min(q,500);i++){ if(a>0&&b>0) list.push([a,b]); } });
      if(!W||!H||!list.length) return {big:'—', detail:['Entrez le panneau et au moins une pièce.']};
      list.sort((p,q)=>Math.max(q[0],q[1])-Math.max(p[0],p[1]) || q[0]*q[1]-p[0]*p[1]);
      const panels=[];
      const tryPlace=(pan,a,b)=>{
        let best=null;
        pan.free.forEach((r,ri)=>{
          const opts=[[a,b]]; if(!v.fil && a!==b) opts.push([b,a]);
          opts.forEach(([w,h])=>{ if(w<=r.w&&h<=r.h){ const s=Math.min(r.w-w,r.h-h); if(!best||s<best.s) best={s,ri,w,h}; } });
        });
        if(!best) return false;
        const r=pan.free.splice(best.ri,1)[0], {w,h}=best;
        pan.pcs.push({x:r.x,y:r.y,w,h});
        let A,B;
        if(r.w-w > r.h-h){ A={x:r.x+w+k,y:r.y,w:r.w-w-k,h:r.h}; B={x:r.x,y:r.y+h+k,w:w,h:r.h-h-k}; }
        else { A={x:r.x+w+k,y:r.y,w:r.w-w-k,h:h}; B={x:r.x,y:r.y+h+k,w:r.w,h:r.h-h-k}; }
        [A,B].forEach(f=>{ if(f.w>0&&f.h>0) pan.free.push(f); });
        return true;
      };
      list.forEach(([a,b])=>{
        const fits = (a<=W&&b<=H) || (!v.fil && b<=W&&a<=H);
        if(!fits){ trop.push(`${a}×${b}`); return; }
        if(!panels.some(p=>tryPlace(p,a,b))){ const p={free:[{x:0,y:0,w:W,h:H}],pcs:[]}; panels.push(p); tryPlace(p,a,b); }
      });
      const used = panels.reduce((s,p)=>s+p.pcs.reduce((t,c)=>t+c.w*c.h,0),0);
      const chute = panels.length ? 100-used/(panels.length*W*H)*100 : 0;
      const det=[`${list.length-trop.length} pièces placées · chutes : ${fr(chute,0)} % de la surface achetée`];
      if(trop.length) det.push({warn:`Trop grandes pour le panneau : ${[...new Set(trop)].join(', ')}`});
      const svg = panels.map((p,i)=>{
        const rects = p.pcs.map(c=>{
          const lab=`${fr(c.w,0)}×${fr(c.h,0)}`, fs=Math.min(c.h*0.3, (c.w*0.88)/(lab.length*0.72), Math.max(W,H)/22);
          return `<rect class="pc" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}"/>`+
            (fs>Math.max(W,H)/90?`<text x="${c.x+c.w/2}" y="${c.y+c.h/2}" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:'');
        }).join('');
        return `<figure><figcaption>Panneau ${i+1} sur ${panels.length}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan de découpe du panneau ${i+1}"><rect class="pan" x="0" y="0" width="${W}" height="${H}"/>${rects}</svg></figure>`;
      }).join('');
      return {big:`${panels.length} panneau${panels.length>1?'x':''}`, detail:det, extra:`<div class="plans">${svg}</div>`,
        item:`Panneaux ${fr(W,0)}×${fr(H,0)} mm : ${panels.length}`};
    }},
  tasseaux:{nom:'Découpe de tasseaux', aide:'Indiquez la longueur des barres vendues et les longueurs dont vous avez besoin.',
    champs:[N('L','Longueur d’une barre','mm',2400),N('k','Épaisseur du trait de scie','mm',3),
      P('pcs',[['Longueur','mm'],['Nombre','pièces']],[[900,4],[600,6],[450,3]])],
    calc(v){
      const L=v.L, k=v.k, list=[], trop=[];
      v.pcs.forEach(([a,q])=>{ for(let i=0;i<Math.min(q,500);i++) if(a>0) list.push(a); });
      if(!L||!list.length) return {big:'—', detail:['Entrez la barre et au moins une longueur.']};
      list.sort((a,b)=>b-a);
      const bars=[];
      list.forEach(a=>{
        if(a>L){ trop.push(a); return; }
        let b=bars.find(b=>b.rest>=a);
        if(!b){ b={rest:L,cuts:[]}; bars.push(b); }
        b.cuts.push(a); b.rest=Math.max(0,b.rest-a-k);
      });
      const det=[`Chute totale : ${fr(bars.reduce((s,b)=>s+b.rest,0)/1000,2)} m`];
      if(trop.length) det.push({warn:`Plus longues que la barre : ${[...new Set(trop)].join(', ')} mm`});
      const html = bars.map((b,i)=>`<figure><figcaption>Barre ${i+1} · reste ${fr(b.rest,0)} mm</figcaption><div class="bar">${
        b.cuts.map(c=>`<div style="flex:0 0 ${c/L*100}%">${fr(c,0)}</div>`).join('')}</div></figure>`).join('');
      return {big:`${bars.length} barre${bars.length>1?'s':''}`, detail:det, extra:`<div class="plans">${html}</div>`,
        item:`Tasseaux de ${fr(L/1000,2)} m : ${bars.length} barres`};
    }},
  planches:{nom:'Calcul de planches', aide:'Pour un bardage ou un habillage de mur. Pour une terrasse, utilisez l’outil Terrasse dans Sols.',
    champs:[N('L','Longueur du mur','m',6),N('H','Hauteur à couvrir','m',2.5),N('lu','Largeur utile d’une planche','cm',13),
      N('lg','Longueur d’une planche','m',4),N('p','Pertes','%',10)],
    calc(v){
      const rang = v.lu ? up(v.H*100/v.lu) : 0, ml = rang*v.L*(1+v.p/100), nb = v.lg ? up(ml/v.lg) : 0;
      return {big:`${nb} planches`, detail:[`Surface : ${fr(v.L*v.H)} m² · ${rang} rangées · ${fr(ml)} mètres linéaires (pertes comprises)`],
        item:`Planches de ${fr(v.lg)} m : ${nb}`};
    }},

  /* ---------- MURS ---------- */
  'papier-peint':{nom:'Papier peint', aide:'Rouleau standard : 10,05 m de long sur 53 cm de large.',
    champs:[N('perim','Tour de la pièce (sans les portes)','m',12),N('haut','Hauteur des murs','m',2.5),

  peinture:{nom:'Peinture', aide:'Mesurez le tour de la pièce et la hauteur sous plafond.',
    champs:[N('perim','Tour de la pièce','m',14),N('haut','Hauteur des murs','m',2.5),N('ouv','Portes et fenêtres à déduire','m²',4),
      C('plaf','Peindre aussi le plafond',false),N('plafs','Surface du plafond','m²',12),

  placo:{nom:'Placo', aide:'Cloison sur ossature métallique. Plaque standard : 1,20 m × 2,50 m.',
    champs:[N('L','Longueur de la cloison','m',4),N('H','Hauteur','m',2.5),
      S('faces','Type d’ouvrage',[['2','Cloison (plaques des 2 côtés)'],['1','Doublage de mur (1 côté)']],'2'),
      N('pl','Largeur d’une plaque','m',1.2),N('ph','Hauteur d’une plaque','m',2.5),N('ent','Écart entre montants','cm',60),
      N('rail','Longueur d’un rail','m',3),N('mont','Longueur d’un montant','m',3)],
    calc(v){
      const f=+v.faces, pl=(v.pl&&v.ph)?up(v.L/v.pl)*up(v.H/v.ph)*f:0, rails=v.rail?up(2*v.L/v.rail):0,

      const det=[`${rails} rails · ${mont} montants`,`Environ ${fr(s*20,0)} vis, ${fr(s*1.4,0)} m de bande, ${fr(s*0.35)} kg d’enduit à joint`];
      if(v.mont && v.mont<v.H) det.push({warn:'Les montants sont plus courts que la hauteur : il faudra les rallonger.'});
      return {big:`${pl} plaques`, detail:det, item:[`Placo : ${pl} plaques ${fr(v.pl)}×${fr(v.ph)} m`,`Rails : ${rails} · Montants : ${mont}`]};
    }},
  'isol-qte':{nom:'Quantité d’isolant', aide:'Le nombre de rouleaux ou de paquets d’isolant pour un mur, et la résistance thermique R obtenue (plus elle est élevée, mieux c’est isolé).',
    champs:[N('L','Longueur du mur','m',5),N('H','Hauteur','m',2.5),N('ouv','Ouvertures à déduire','m²',2),
      N('sr','Surface d’un rouleau ou d’un paquet','m²',5),N('p','Pertes','%',5),
      N('ep','Épaisseur de l’isolant','cm',10),N('lam','Lambda (λ) indiqué sur l’emballage','W/m.K',0.032)],
    calc(v){
      const s=Math.max(0,v.L*v.H-v.ouv), st=s*(1+v.p/100), nb=v.sr?up(st/v.sr):0, R=v.lam?(v.ep/100)/v.lam:0;
      return {big:`${nb} rouleau${nb>1?'x':''}`, detail:[`Surface : ${fr(s)} m² · avec pertes : ${fr(st)} m²`,`Résistance thermique R ≈ ${fr(R,2)} m².K/W`],
        item:`Isolant ${fr(v.ep,0)} cm : ${nb} rouleaux ou paquets`};
    }},
  enduit:{nom:'Enduit', aide:'La consommation est écrite sur le sac (en kg par m² et par mm d’épaisseur).',
    champs:[N('s','Surface','m²',20),N('ep','Épaisseur','mm',2),N('c','Consommation','kg par m² par mm',1.2),N('sac','Poids d’un sac','kg',25),N('p','Pertes','%',10)],
    calc(v){
      const kg=v.s*v.ep*v.c*(1+v.p/100), sacs=v.sac?up(kg/v.sac):0;

  terrasse:{nom:'Terrasse', aide:'Les lames sont posées dans le sens de la longueur, les lambourdes en travers.',

  beton:{nom:'Béton', aide:'Dosage courant pour une dalle : 350 kg de ciment par m³.',

  parpaings:{nom:'Parpaings', aide:'Parpaing standard : 50 cm × 20 cm de face, soit 10 par m².',
    champs:[N('L','Longueur du mur','m',5),N('H','Hauteur du mur','m',2),N('ouv','Ouvertures à déduire','m²',0),
      N('bL','Longueur d’un bloc','cm',50),N('bH','Hauteur d’un bloc','cm',20),N('p','Pertes','%',5)],
    calc(v){
      const s=Math.max(0,v.L*v.H-v.ouv), a=v.bL*v.bH/1e4, nb=a?up(s*(1+v.p/100)/a):0, rangs=v.bH?up(v.H*100/v.bH):0;
      return {big:`${nb} blocs`, detail:[`Surface : ${fr(s)} m² · ${fr(a?1/a:0)} blocs par m² · ${rangs} rangs`], item:`Parpaings ${fr(v.bL,0)}×${fr(v.bH,0)} : ${nb}`};
    }},
  pente:{nom:'Pente', aide:'Exemple : une allée qui descend de 5 cm sur 2 mètres.',
    champs:[N('h','Différence de hauteur','cm',5),N('d','Longueur à plat','m',2)],
    calc(v){
      const r=v.d?(v.h/100)/v.d:0;
      return {big:`${fr(r*100,1)} %`, detail:[`Soit ${fr(Math.atan(r)*180/Math.PI,2)}° · ou ${fr(r*100,1)} cm par mètre`,`Longueur réelle de la rampe : ${fr(Math.hypot(v.d,v.h/100),2)} m`]};
    }},

  /* ---------- DIVERS ---------- */
  cables:{nom:'Câbles et gaines', aide:'Estimation des longueurs pour un circuit. Respectez la norme NF C 15-100 et faites contrôler par un professionnel.',
    champs:[S('type','Type de circuit',[['ecl','Éclairage (fil 1,5 mm², 8 points max)'],['p16','Prises 16 A (fil 1,5 mm², 8 prises max)'],['p20','Prises 20 A (fil 2,5 mm², 12 prises max)']],'p20'),
      N('n','Nombre de points (prises ou lumières)','',6),N('d','Distance du tableau au premier point','m',10),N('e','Distance moyenne entre deux points','m',3),N('m','Marge pour les montées et descentes','%',20)],
    calc(v){
      const max={ecl:8,p16:8,p20:12}[v.type], sec=v.type==='p20'?'2,5':'1,5', c=v.n>0?up(v.n/max):0;
      const g=(c*v.d+Math.max(0,v.n-c)*v.e)*(1+v.m/100), cour=up(g/100);
      return {big:`${fr(g,0)} m de gaine`, detail:[`${c} circuit(s) nécessaire(s)`,`Fil ${sec} mm² : ${fr(g,0)} m de chaque couleur (phase, neutre, terre), soit ${cour} couronne(s) de 100 m par couleur`],
        item:[`Gaine : ${fr(g,0)} m`,`Fil ${sec} mm² : ${cour} couronne(s) de 100 m × 3 couleurs`]};
    }},
  unites:{nom:'Conversions d’unités', aide:'Entrez une valeur et son unité : toutes les équivalences s’affichent.',
    champs:[N('x','Valeur','',1),S('u','Unité',UNITS,'m')],
    calc(v){
      const fam=UNITS.find(f=>f.u.some(u=>u[0]===v.u)), base=v.x*fam.u.find(u=>u[0]===v.u)[2];
      const lines=fam.u.filter(u=>u[0]!==v.u).map(u=>`${fr(base/u[2],4)} ${u[1]}`);
      const me=fam.u.find(u=>u[0]===v.u);
      return {big:`${fr(v.x,4)} ${me[1]}`, detail:lines.map(l=>'= '+l)};
    }},
  surfaces:{nom:'Surfaces', aide:'Choisissez la forme et l’unité de vos mesures, puis entrez les dimensions.',
    champs:[S('f','Forme',[['rect','Rectangle ou carré'],['tri','Triangle'],['disque','Cercle (disque)'],['trap','Trapèze'],['L','Pièce en L (deux rectangles)']],'rect'),
      S('u','Unité des mesures',[['m','mètres'],['cm','centimètres'],['mm','millimètres']],'m'),
      N('rL','Longueur','',4,{k:'f',v:['rect']}),N('rl','Largeur','',3,{k:'f',v:['rect']}),
      N('tb','Base','',4,{k:'f',v:['tri']}),N('th','Hauteur (perpendiculaire à la base)','',2,{k:'f',v:['tri']}),
      N('dd','Diamètre','',2,{k:'f',v:['disque']}),
      N('ga','Grande base','',5,{k:'f',v:['trap']}),N('pb','Petite base','',3,{k:'f',v:['trap']}),N('zh','Hauteur','',2,{k:'f',v:['trap']}),
      N('L1','Partie 1 : longueur','',5,{k:'f',v:['L']}),N('l1','Partie 1 : largeur','',3,{k:'f',v:['L']}),
      N('L2','Partie 2 : longueur','',2,{k:'f',v:['L']}),N('l2','Partie 2 : largeur','',2,{k:'f',v:['L']})],
    calc(v){
      const k={m:1,cm:0.01,mm:0.001}[v.u]; let s=0, per=null;
      if(v.f==='rect'){ s=v.rL*v.rl*k*k; per=2*(v.rL+v.rl)*k; }
      if(v.f==='tri') s=v.tb*v.th/2*k*k;
      if(v.f==='disque'){ s=Math.PI*(v.dd/2)**2*k*k; per=Math.PI*v.dd*k; }
      if(v.f==='trap') s=(v.ga+v.pb)/2*v.zh*k*k;
      if(v.f==='L') s=(v.L1*v.l1+v.L2*v.l2)*k*k;
      const det=[`Soit ${fr(s*1e4,0)} cm²`];
      if(per!==null) det.push(`Périmètre : ${fr(per,2)} m`);
      return {big:`${fr(s,2)} m²`, detail:det};
    }},
  volumes:{nom:'Volumes', aide:'Choisissez la forme et l’unité de vos mesures, puis entrez les dimensions.',
    champs:[S('f','Forme',[['pave','Pavé (dalle, bac, tranchée, pièce)'],['cyl','Cylindre (poteau, puits, cuve)'],['cone','Cône (tas de sable ou de gravier)']],'pave'),
      S('u','Unité des mesures',[['m','mètres'],['cm','centimètres'],['mm','millimètres']],'m'),
      N('pL','Longueur','',3,{k:'f',v:['pave']}),N('pl','Largeur','',2,{k:'f',v:['pave']}),N('ph','Hauteur ou épaisseur','',0.5,{k:'f',v:['pave']}),
      N('cd','Diamètre','',0.4,{k:'f',v:['cyl']}),N('ch','Hauteur','',2,{k:'f',v:['cyl']}),
      N('od','Diamètre au sol','',2,{k:'f',v:['cone']}),N('oh','Hauteur du tas','',0.8,{k:'f',v:['cone']})],
    calc(v){
      const k={m:1,cm:0.01,mm:0.001}[v.u]; let vol=0;
      if(v.f==='pave') vol=v.pL*v.pl*v.ph*k**3;
      if(v.f==='cyl') vol=Math.PI*(v.cd/2)**2*v.ch*k**3;
      if(v.f==='cone') vol=Math.PI*(v.od/2)**2*v.oh/3*k**3;
      return {big:`${fr(vol,3)} m³`, detail:[`Soit ${fr(vol*1000,0)} litres`,`Rempli de béton, cela pèserait environ ${fr(vol*2.4,2)} tonnes`]};
    }},
  fondations:{nom:'Fondations', aide:'Semelle filante sous un mur, ou plots pour un abri, une terrasse ou un poteau. Profondeur hors gel : 50 à 90 cm selon la région.',
    champs:[S('t','Type de fondation',[['fil','Semelle filante (sous les murs)'],['plot','Plots (semelles isolées)']],'fil'),
      N('L','Longueur totale des semelles','m',30,{k:'t',v:['fil']}),N('l','Largeur de la semelle','cm',50,{k:'t',v:['fil']}),
      N('n','Nombre de plots','',6,{k:'t',v:['plot']}),N('c','Côté d’un plot (plot carré)','cm',60,{k:'t',v:['plot']}),
      N('h','Hauteur de béton','cm',35),N('p','Profondeur de la fouille','cm',80),N('pr','Béton de propreté au fond','cm',5),
      N('dos','Dosage en ciment','kg par m³',350),N('sac','Poids d’un sac de ciment','kg',35),
      N('fer','Longueur d’une armature de semelle','m',6,{k:'t',v:['fil']})],
    calc(v){
      const fil=v.t==='fil', A=fil ? v.L*v.l/100 : v.n*(v.c/100)**2;
      const vb=A*v.h/100, vp=A*v.pr/100, vf=A*v.p/100, cim=vb*v.dos+vp*150, sacs=v.sac?up(cim/v.sac):0, vt=vb+vp;
      const arm = fil ? (v.fer>0.5?up(v.L/(v.fer-0.5)):0) : v.n;
      const det=[`Béton de fondation : ${fr(vb,2)} m³ · béton de propreté : ${fr(vp,2)} m³`,
        `Ciment ≈ ${fr(cim,0)} kg, soit ${sacs} sacs · sable ≈ ${fr(vt*680,0)} kg · gravier ≈ ${fr(vt*1175,0)} kg · eau ≈ ${fr(vt*175,0)} litres`,
        `Terre à creuser : ${fr(vf,2)} m³, soit environ ${fr(vf*1.25,2)} m³ à évacuer (la terre gonfle une fois sortie)`,
        fil ? `Ferraillage : ${arm} armatures de ${fr(v.fer)} m (50 cm de recouvrement entre deux), plus une équerre par angle`
            : `Ferraillage : ${arm} cage(s) ou treillis, un par plot`];
      if(v.p < v.h+v.pr) det.push({warn:'La fouille est moins profonde que le béton prévu : vérifiez la profondeur.'});
      return {big:`${fr(vb+vp,2)} m³ de béton`, detail:det,
        item:[`Fondations : ${sacs} sacs de ciment, ${fr(vt*680,0)} kg de sable, ${fr(vt*1175,0)} kg de gravier`, fil?`Armatures de semelle ${fr(v.fer)} m : ${arm}`:`Cages d’armature pour plots : ${arm}`]};
    }},
  tableau:{nom:'Tableau électrique (boîte à fusibles)', aide:'Prépare la composition et le plan d’un tableau en monophasé ou en triphasé, selon les règles courantes de la norme NF C 15-100. À faire vérifier par un électricien.',
    champs:[S('res','Type de branchement',[['mono','Monophasé (2 fils : phase et neutre)'],['tri','Triphasé (4 fils : 3 phases et neutre)']],'mono'),
      N('surf','Surface du logement','m²',90),N('ecl','Nombre de points lumineux','',14),N('pr','Nombre de prises (hors appareils ci-dessous)','',24),
      S('prt','Circuits de prises',[['20','20 A, fil 2,5 mm² (12 prises max)'],['16','16 A, fil 1,5 mm² (8 prises max)']],'20'),
      N('chauf','Chauffage électrique, puissance totale (0 si aucun)','W',0),N('vr','Nombre de circuits de volets roulants','',0),
      S('rang','Taille des rangées du coffret',[['13','13 modules'],['18','18 modules']],'13'),
      C('plaque','Plaque de cuisson',true),C('pltri','Plaque de cuisson branchée en triphasé',true,{k:'res',v:['tri']}),
      C('four','Four',true),C('ll','Lave-linge',true),C('lv','Lave-vaisselle',true),
      C('sl','Sèche-linge',false),C('cong','Congélateur',false),C('ce','Chauffe-eau électrique (avec contacteur heures creuses)',true),
      C('vmc','VMC',true),C('ve','Prise pour voiture électrique',false),C('pf','Parafoudre',true)],
    calc(v){
      const tri=v.res==='tri', PH=['L1','L2','L3'];
      const cir=[], add=(nom,cal,sec,k,o={})=>cir.push({nom,cal,sec,k,w:cal*(o.plein?1:0.5),A:!!o.A,seul:!!o.seul,ct:!!o.ct,t3:!!o.t3});
      const ne=up(Math.max(0,v.ecl)/8); for(let i=0;i<ne;i++) add(`Éclairage ${i+1}`,16,'1,5','ecl');
      const pm=v.prt==='20'?12:8, np=up(Math.max(0,v.pr)/pm); for(let i=0;i<np;i++) add(`Prises ${i+1}`,+v.prt,v.prt==='20'?'2,5':'1,5','pr');
      const pl3 = tri && v.plaque && v.pltri;
      if(v.plaque){ if(pl3) add('Plaque de cuisson',20,'2,5','pl',{A:true,t3:true}); else add('Plaque de cuisson',32,'6','pl',{A:true}); }
      if(v.four) add('Four',20,'2,5','four');
      if(v.ll) add('Lave-linge',20,'2,5','ll',{A:true});
      if(v.lv) add('Lave-vaisselle',20,'2,5','lv');
      if(v.sl) add('Sèche-linge',20,'2,5','sl');
      if(v.cong) add('Congélateur',20,'2,5','cong');
      if(v.ce) add('Chauffe-eau',20,'2,5','ce',{plein:true,ct:true});
      if(v.vmc) add('VMC',2,'1,5','vmc');
      for(let i=0;i<Math.max(0,Math.round(v.vr));i++) add(`Volets roulants ${i+1}`,16,'1,5','vr');
      const nch=up(Math.max(0,v.chauf)/4500); for(let i=0;i<nch;i++) add(`Chauffage ${i+1}`,20,'2,5','ch',{plein:true});
      if(v.ve) add('Voiture électrique',20,'2,5','ve',{plein:true,seul:true,A:true});
      if(!cir.length) return {big:'—', detail:['Indiquez au moins un circuit.']};

      // Différentiels : minimum selon la surface, 8 circuits maximum chacun, 63 A maximum.
      // En triphasé, chaque différentiel bipolaire est raccordé sur une phase ; celui de la plaque triphasée est tétrapolaire.
      const ph={L1:0,L2:0,L3:0}, minPh=()=>PH.reduce((b,p)=>ph[p]<ph[b]?p:b,'L1');
      const nAC = v.surf<=35 ? 1 : v.surf<=100 ? 2 : 3;
      const G=[]; let rr=0;
      const newG=(t,o={})=>{ const g={t,c:[],load:0,p4:!!o.p4,seul:!!o.seul,ph:null}; if(tri && !g.p4) g.ph=PH[rr++%3]; G.push(g); return g; };
      for(let i=0;i<nAC;i++) newG('AC'); newG('A',{p4:pl3});
      const score=(g,c)=>g.load+12*g.c.filter(y=>y.k===c.k).length+(tri?0.8*(g.p4?ph[minPh()]:ph[g.ph]):0);
      const put1=(g,c)=>{ g.c.push(c); g.load+=c.w;
        if(!tri) return;
        if(c.t3){ PH.forEach(p=>ph[p]+=c.w/3); c.ph='L1 L2 L3'; }
        else { c.ph = g.p4 ? minPh() : g.ph; ph[c.ph]+=c.w; } };
      const place=(c)=>{
        if(c.seul){ const g=newG('A',{seul:true}); put1(g,c); return; }
        if(c.t3){ put1(G.find(g=>g.p4),c); return; }
        const ok=G.filter(g=>!g.seul && (!c.A || g.t==='A') && g.c.length<8 && g.load+c.w<=63);
        const g = ok.length ? ok.reduce((b,x)=>score(x,c)<score(b,c)?x:b) : newG(c.A?'A':'AC');
        put1(g,c);
      };
      cir.filter(c=>c.t3).forEach(place);
      cir.filter(c=>(c.A||c.seul)&&!c.t3).forEach(place);
      cir.filter(c=>!c.A&&!c.seul).sort((a,b)=>b.w-a.w).forEach(place);
      // Triphasé : on cherche la répartition qui charge le plus pareil possible les trois phases
      if(tri){
        const calc3=()=>{ PH.forEach(p=>ph[p]=0); G.forEach(g=>g.c.forEach(c=>{ if(c.t3) PH.forEach(p=>ph[p]+=c.w/3); else ph[g.p4?c.ph:g.ph]+=c.w; })); const x=PH.map(p=>ph[p]); return Math.max(...x)-Math.min(...x); };
        const bip=G.filter(g=>!g.p4);
        const bestPhases=()=>{ let best=calc3(), keep=bip.map(g=>g.ph);
          for(let m=0;m<3**bip.length && m<20000;m++){ let x=m; bip.forEach(g=>{ g.ph=PH[x%3]; x=Math.floor(x/3); }); const e=calc3(); if(e<best-1e-9){ best=e; keep=bip.map(g=>g.ph); } }
          bip.forEach((g,i)=>g.ph=keep[i]); return calc3(); };
        let cur=bestPhases();
        for(let it=0; it<60; it++){
          let best=null;
          G.forEach(g1=>{ if(g1.seul) return; g1.c.forEach(c=>{ if(c.t3) return;
            if(g1.p4) PH.forEach(p=>{ if(p===c.ph) return; const o=c.ph; c.ph=p; const e=calc3(); c.ph=o; if(e<cur-0.5 && (!best||e<best.e)) best={e,f:()=>{c.ph=p;}}; });
            G.forEach(g2=>{ if(g2===g1||g2.seul||(c.A&&g2.t!=='A')||g2.c.length>=8||g2.load+c.w>63||g2.c.some(y=>y.k===c.k)) return;
              const o=c.ph; g1.c.splice(g1.c.indexOf(c),1); g2.c.push(c); if(g2.p4) c.ph=minPh();
              const e=calc3(); g2.c.pop(); g1.c.push(c); c.ph=o;
              if(e<cur-0.5 && (!best||e<best.e)) best={e,f:()=>{ g1.c.splice(g1.c.indexOf(c),1); g1.load-=c.w; g2.c.push(c); g2.load+=c.w; if(g2.p4){ calc3(); c.ph=minPh(); } }}; });
          }); });
          if(!best) break; best.f(); cur=bestPhases();
        }
        calc3(); G.forEach(g=>g.c.forEach(c=>{ if(!c.t3 && !g.p4) c.ph=g.ph; }));
      }
      G.forEach(g=>{ g.cal = (v.surf<=35 && g.t==='AC' && g.load<=25) ? 25 : g.load<=40 ? 40 : 63; });
      const order=[...G.filter(g=>g.t==='AC'),...G.filter(g=>g.t==='A'&&!g.seul),...G.filter(g=>g.seul)];

      // Plan du coffret : 20 % de place libre gardée sur chaque rangée
      const court=n=>n.replace('Plaque de cuisson','Plaque').replace('Lave-vaisselle','L-vaisselle').replace('Lave-linge','L-linge').replace('Sèche-linge','S-linge').replace('Voiture électrique','Voiture').replace('Volets roulants','Volets').replace('Éclairage','Éclair.').replace('Chauffage','Chauff.').replace('Congélateur','Congél.');
      const per=+v.rang, cap=Math.floor(per*0.8), rows=[[]]; let used=0;
      const room=()=>cap-rows[rows.length-1].reduce((s,x)=>s+x.m,0);
      const put=it=>{ if(room()<it.m) rows.push([]); rows[rows.length-1].push(it); used+=it.m; };
      if(v.pf){ put({cl:'m-pf',m:tri?4:2,lab:tri?'Parafoudre tri':'Parafoudre'}); put({cl:'m-dj',m:1,lab:'Disj. PF'}); }
      order.forEach((g,i)=>{
        const items=[{cl:'m-id',m:g.p4?4:2,lab:`Diff. ${i+1}<br>${g.cal}A type ${g.t}${tri?(g.p4?' · tétra':' · '+g.ph):''}`}];
        g.c.forEach(c=>{ items.push({cl:'m-dj',m:c.t3?4:1,lab:`${c.cal}A ${court(c.nom)}${c.t3?' tri':''}`}); if(c.ct) items.push({cl:'m-ct',m:1,lab:'Contact. HC'}); });
        const size=items.reduce((s,x)=>s+x.m,0), r=rows[rows.length-1];
        if(r.some(x=>x.grp) || (r.length && room()<size)) rows.push([]);
        items.forEach(x=>x.grp=true);
        items.forEach(put);
      });
      const total=rows.length*per, free=total-used;
      const plan=rows.map((r,i)=>{
        const n=r.reduce((s,x)=>s+x.m,0);
        return `<figure><figcaption>Rangée ${i+1}</figcaption><div class="tab-row" style="grid-template-columns:repeat(${per},minmax(0,1fr))">${
          r.map(x=>`<div class="mod ${x.cl}" style="grid-column:span ${x.m}"><span>${x.lab}</span></div>`).join('')}${
          '<div class="mod m-free"></div>'.repeat(per-n)}</div></figure>`;
      }).join('');
      const pose=g=> !tri ? '' : g.p4 ? ', tétrapolaire, sur les 3 phases' : `, bipolaire, raccordé sur la phase ${g.ph}`;
      const leg=order.map((g,i)=>`<div class="tab-g"><b>Différentiel ${i+1} : ${g.cal} A, type ${g.t}, 30 mA${pose(g)}</b>
        <span class="u"> · ${g.c.length} circuit${g.c.length>1?'s':''} · intensité de calcul ≈ ${fr(g.load,0)} A</span>
        <ul>${g.c.map(c=>`<li>${c.nom} : disjoncteur ${c.cal} A${c.t3?' tétrapolaire, câble 5G2,5 (3 phases + neutre + terre)':`, fil ${c.sec} mm²`}${c.ct?' (+ contacteur heures creuses)':''}${tri&&g.p4&&!c.t3?` · phase ${c.ph}`:''}</li>`).join('')||'<li>Aucun circuit pour l’instant (réserve)</li>'}</ul></div>`).join('');
      let equil='';
      if(tri){
        const vals=PH.map(p=>ph[p]), mx=Math.max(...vals), mn=Math.min(...vals), moy=vals.reduce((a,b)=>a+b,0)/3;
        equil=`<div class="tab-g"><b>Équilibrage des phases</b><div class="phases">${PH.map(p=>`<div><span>${p}</span><i style="width:${mx?ph[p]/mx*100:0}%"></i><b>${fr(ph[p],0)} A</b></div>`).join('')}</div>
          <span class="u">Écart entre la phase la plus chargée et la moins chargée : ${fr(mx-mn,0)} A${moy&&(mx-mn)>moy*0.3?' (à améliorer en déplaçant un circuit)':' (bon équilibre)'}</span></div>`;
      }
      const notes=[
        tri ? 'En amont du tableau : le disjoncteur de branchement tétrapolaire, installé par le fournisseur d’électricité.' : 'En amont du tableau : le disjoncteur de branchement, installé par le fournisseur d’électricité.',
        tri ? 'Chaque différentiel bipolaire est alimenté par une seule phase et le neutre. Les circuits sont répartis pour que les trois phases soient chargées à peu près pareil.' : null,
        'Chaque différentiel protège 8 circuits au maximum. Plaque de cuisson, lave-linge et voiture électrique sont sur un différentiel de type A.',
        'Intensité de calcul d’un différentiel : chauffage, chauffe-eau et voiture comptés en entier, les autres circuits pour moitié. Au-delà de 40 A, on prend un 63 A.',
        pl3 ? 'Plaque en triphasé : disjoncteur 20 A tétrapolaire et câble 5G2,5, à condition que la plaque le permette (voir sa notice).' : null,
        'Au moins 20 % de place libre est gardée sur chaque rangée pour les ajouts futurs. La largeur des appareils varie un peu selon les marques.',
        tri ? 'Prévoir des peignes adaptés au triphasé et un bornier de terre.' : 'Prévoir un peigne d’alimentation par rangée et un bornier de terre.',
        v.pf ? 'Parafoudre : obligatoire dans certaines communes exposées à la foudre, conseillé partout.' : 'Pensez au parafoudre : obligatoire dans certaines communes exposées à la foudre.',
        v.chauf>0 ? 'Chauffage : un circuit de 20 A par tranche de 4 500 W au maximum.' : null,
        'Pompe à chaleur ou climatisation : prévoir un différentiel de type F, selon la notice de l’appareil.',
      ].filter(Boolean);
      const extra=`<div class="tab">${plan}<div class="legend-mods"><span><i class="mod m-id"></i>Différentiel</span><span><i class="mod m-dj"></i>Disjoncteur</span><span><i class="mod m-ct"></i>Contacteur</span><span><i class="mod m-pf"></i>Parafoudre</span><span><i class="mod m-free"></i>Libre</span></div>
        ${equil}${leg}<div class="tab-notes"><b>À savoir</b><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul>
        <p class="warn">Plan indicatif. Faites vérifier l’installation par un électricien qualifié, et par le Consuel pour une installation neuve.</p></div></div>`;
      const cnt=(arr,key)=>arr.reduce((m,x)=>(m[key(x)]=(m[key(x)]||0)+1,m),{});
      const ids=cnt(order,g=>`${g.cal} A type ${g.t}${tri?(g.p4?' tétrapolaire':' bipolaire'):''}`), djs=cnt(cir,c=>`${c.cal} A${c.t3?' tétrapolaire':''}`);
      const items=[`Coffret ${rows.length} rangée${rows.length>1?'s':''} de ${per} modules`,
        ...Object.entries(ids).map(([k,n])=>`Interrupteur différentiel 30 mA ${k} : ${n}`),
        ...Object.entries(djs).sort((a,b)=>parseFloat(a[0])-parseFloat(b[0])).map(([k,n])=>`Disjoncteur ${k} : ${n}`),
        ...(v.ce?['Contacteur heures creuses : 1']:[]), ...(v.pf?[`Parafoudre ${tri?'triphasé ':''}avec son disjoncteur : 1`]:[]),
        `Peignes d’alimentation : ${rows.length}`];
      const det=[`${order.length} interrupteurs différentiels · ${cir.length} disjoncteurs`,`${free} modules libres sur ${total} (${fr(free/total*100,0)} %)`];
      if(tri) det.push(`Phases : L1 ≈ ${fr(ph.L1,0)} A · L2 ≈ ${fr(ph.L2,0)} A · L3 ≈ ${fr(ph.L3,0)} A`);
      return {big:`${rows.length} rangée${rows.length>1?'s':''} de ${per} modules`, detail:det, extra, item:items};
    }},
  crepi:{nom:'Enduits de façade (crépi)', aide:'Dosages par couche et quantités pour crépir un mur, selon le type d’enduit. Le gobetis accroche, le corps d’enduit dresse le mur, la finition donne l’aspect.',
    champs:[S('t','Type d’enduit',[['ciment','Enduit au ciment (3 couches)'],['batard','Enduit bâtard ciment + chaux (3 couches)'],['nhl','Enduit à la chaux hydraulique NHL (3 couches)'],['cl','Enduit à la chaux aérienne CL (3 couches)'],['mono','Monocouche prêt à l’emploi (1 couche)']],'nhl'),
      N('s','Surface à enduire','m²',30),
      S('fin','Finition',[['taloche','Talochée (environ 5 mm)'],['ecrase','Écrasée ou projetée (environ 7 mm)'],['gratte','Grattée (environ 12 mm)']],'taloche',{k:'t',v:['ciment','batard','nhl','cl']}),
      N('ep','Épaisseur du monocouche','mm',15,{k:'t',v:['mono']}),
      N('p','Pertes','%',10)],
    calc(v){
      const lc=t=>t.charAt(0).toLowerCase()+t.slice(1);
      const DENS={'Ciment':1.2,'Chaux NHL':0.8,'Chaux NHL 5':0.8,'Chaux NHL 3,5':0.8,'Chaux NHL 2 ou 3,5':0.8,'Chaux aérienne CL 90':0.5}, SAC={'Ciment':35};
      const fin={taloche:5,ecrase:7,gratte:12}[v.fin]||5, k=1+v.p/100;
      if(v.t==='mono'){
        const kg=v.s*v.ep*1.4*k, sacs=up(kg/25);
        return {big:`${sacs} sacs de 25 kg`, detail:[`Environ ${fr(kg,0)} kg de monocouche pour ${fr(v.s)} m² sur ${fr(v.ep,0)} mm (pertes comprises)`,
          'Consommation comptée : 1,4 kg par m² et par mm. Vérifiez la valeur sur le sac (souvent 1,3 à 1,6).',
          {warn: v.ep<10 ? 'Épaisseur trop faible : 10 mm au minimum en tout point.' : null}].filter(x=>!(x&&x.warn===null)),
          extra:`<div class="tab-notes"><b>Bon à savoir</b><ul><li>Un seul produit, déjà dosé : il suffit d’ajouter l’eau indiquée sur le sac.</li><li>Appliquer en deux passes « frais dans frais », puis finir (gratté, taloché…) selon la notice.</li><li>Travailler entre 5 et 30 °C, à l’abri du plein soleil, du vent et de la pluie.</li></ul></div>`,
          item:`Enduit monocouche : ${sacs} sacs de 25 kg`};
      }
      const T={
        ciment:{c:[['Gobetis (accrochage)',5,[['Ciment',500]]],['Corps d’enduit',15,[['Ciment',400]]],['Finition',fin,[['Ciment',300]]]],
          delai:'48 heures au moins entre deux couches, en réhumidifiant la couche précédente.',
          note:'Dur et peu perméable. À éviter sur les murs anciens (pierre, terre, brique pleine) : il empêche le mur de respirer et provoque des remontées d’humidité.'},
        batard:{c:[['Gobetis (accrochage)',5,[['Ciment',450]]],['Corps d’enduit',15,[['Ciment',175],['Chaux NHL',175]]],['Finition',fin,[['Ciment',125],['Chaux NHL',125]]]],
          delai:'48 heures au moins entre deux couches, en réhumidifiant la couche précédente.',
          note:'Compromis entre la solidité du ciment et la souplesse de la chaux. Convient bien aux parpaings et briques.'},
        nhl:{c:[['Gobetis (accrochage)',5,[['Chaux NHL 5',400]]],['Corps d’enduit (dressage)',15,[['Chaux NHL 3,5',320]]],['Finition',fin,[['Chaux NHL 2 ou 3,5',240]]]],
          delai:'Plusieurs jours entre deux couches (environ une semaine pour le corps d’enduit), en humidifiant.',
          note:'Laisse respirer le mur : le bon choix pour les maisons anciennes en pierre. Durcit plus lentement que le ciment.'},
        cl:{c:[['Gobetis (accrochage)',5,[['Chaux aérienne CL 90',325]]],['Corps d’enduit (dressage)',15,[['Chaux aérienne CL 90',250]]],['Finition',fin,[['Chaux aérienne CL 90',200]]]],
          delai:'Une semaine ou plus entre deux couches : la chaux aérienne durcit au contact de l’air.',
          note:'Très souple et perméable, mais lente à durcir. Plutôt pour l’intérieur, la restauration ou une façade bien abritée.'},
      }[v.t];
      const tot={}; let sableTot=0;
      const rows=T.c.map(([nom,e,liants])=>{
        const vs=v.s*e/1000*k; sableTot+=vs;
        const qte=liants.map(([l,d])=>{ const kg=vs*d; tot[l]=(tot[l]||0)+kg; return `${fr(kg,0)} kg de ${lc(l)}`; }).join(' + ');
        const L=liants.map(([l,d])=>d/100/(DENS[l]||0.8));
        const rec = L.length===1 ? `1 seau de liant pour ${fr(Math.round(10/L[0]*2)/2,1)} seaux de sable`
          : `1 seau de ciment + ${fr(Math.round(L[1]/L[0]*2)/2,1)} seau de chaux pour ${fr(Math.round(10/L[0]*2)/2,1)} seaux de sable`;
        return `<tr><td>${nom}</td><td>${e} mm</td><td>${liants.map(([l,d])=>`${d} kg ${lc(l)}`).join(' + ')}</td><td>${rec}</td><td>${qte}<br><span class="u">sable ≈ ${fr(vs*1500,0)} kg</span></td></tr>`;
      }).join('');
      const sacs=Object.entries(tot).map(([l,kg])=>{ const sz=SAC[l]||25; return [l,kg,up(kg/sz),sz]; });
      const table=`<div class="tbl"><table><thead><tr><th>Couche</th><th>Épaisseur</th><th>Dosage par m³ de sable</th><th>Recette au seau</th><th>Pour votre surface</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      const notes=`<div class="tab-notes"><b>Bon à savoir</b><ul><li>${T.note}</li><li>Délais : ${T.delai}</li>
        <li>Le dosage diminue d’une couche à l’autre : la couche du dessous doit toujours être plus dure que celle du dessus.</li>
        <li>Mouiller le mur la veille et le jour même, sans le détremper. Gobetis projeté à la truelle, très fluide.</li>
        <li>Travailler entre 5 et 30 °C, jamais par gel, plein soleil, vent sec ou pluie. Protéger l’enduit frais.</li>
        <li>Sable propre 0/2 à 0/4. Un seau de 10 litres de sable sec pèse environ 15 kg.</li></ul></div>`;
      return {big:sacs.map(([l,,n,sz])=>`${n} sac${n>1?'s':''} de ${lc(l)}`).join(' + '),
        detail:[`Sable : environ ${fr(sableTot*1500,0)} kg (${fr(sableTot,2)} m³) pour ${fr(v.s)} m², pertes comprises`,
          sacs.map(([l,kg,n,sz])=>`${l} : ${fr(kg,0)} kg, soit ${n} sac${n>1?'s':''} de ${sz} kg`).join(' · '),
          `Épaisseur totale : environ ${5+15+fin} mm en 3 couches`],
        extra:table+notes,
        item:[...sacs.map(([l,,n,sz])=>`${l} (enduit) : ${n} sacs de ${sz} kg`),`Sable 0/4 pour enduit : ${fr(sableTot*1500,0)} kg`]};
    }},

const cascade=matchMedia('(hover:hover) and (min-width:1100px)');
let tGrp=null;
function ouvrirGrp(g){ const pan=g.parentElement; pan.querySelectorAll('.rub-g.open').forEach(x=>{ if(x!==g){ x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded','false'); } }); g.classList.add('open'); g.firstElementChild.setAttribute('aria-expanded','true'); }
view.addEventListener('mouseover', e=>{
  if(!cascade.matches) return;
  if(e.target.closest('.rub-gs')){ clearTimeout(tGrp); return; }
  const g=e.target.closest('.rub-g');
  if(!g){ if(e.target.closest('.rub-t')){ clearTimeout(tGrp); tGrp=setTimeout(()=>e.target.closest('.rub-in')?.querySelectorAll('.rub-g.open').forEach(x=>{ x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded','false'); }),350); } return; }
  if(g.classList.contains('open')){ clearTimeout(tGrp); return; }
  clearTimeout(tGrp);
  if(g.parentElement.querySelector('.rub-g.open')) tGrp=setTimeout(()=>ouvrirGrp(g),350); else ouvrirGrp(g);
});
view.addEventListener('mouseout', e=>{
  if(!cascade.matches) return;
  const r=e.target.closest('.rub'); if(!r || (e.relatedTarget && r.contains(e.relatedTarget))) return;
  clearTimeout(tGrp); r.querySelectorAll('.rub-g.open').forEach(x=>{ x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded','false'); });
});

    else { sv[c.id]=el.value; v[c.id]=el.value; }
  });
  store('atelier-valeurs',saved);

function update(){

function fil(pts,k,live){ const d=sP(pts); let s=`<path class="w k-${k}" d="${d}"/>`; if(k==='te') s+=`<path class="w te2" d="${d}"/>`; if(live) s+=`<path class="flow" d="${d}"/>`; return s; }

const sTerm=(x,y)=>`<circle class="term" cx="${x}" cy="${y}" r="3"/>`;
const act=(id,lab,inner,hit)=>`<g class="act" data-act="${id}" tabindex="0" role="button" aria-label="${lab}">${hit?`<rect class="hit" x="${hit[0]}" y="${hit[1]}" width="${hit[2]}" height="${hit[3]}"/>`:''}${inner}</g>`;
function sTab(exits,prot){

    +prot.map((t,i)=>Array.isArray(t)?sTxt(39,t[0],t[1],'middle','sm'):sTxt(39,128+i*14,t,'middle','sm')).join('')

function sLamp(x,y,on){

function sSw(x,y,on,id,lab){
  const ex=on?x+36:x+31, ey=on?y:y-17;
  return act(id,lab||'Interrupteur',`${sTerm(x,y)}${sTerm(x+36,y)}<path class="blade" d="M${x} ${y}L${ex} ${ey}"/>${lab?sTxt(x+18,y+24,lab,'middle','sm'):''}`,[x-8,y-30,52,46]);
}

let schCur=null, schState={}, schTimer=null;
function schStop(){ if(schTimer){ clearInterval(schTimer); schTimer=null; } }
function schemasHTML(){
  return `<section class="card"><h2>Bibliothèque de schémas</h2><p class="hint">Choisissez un schéma. Touchez les interrupteurs sur le dessin, ou les boutons en dessous, pour voir le courant circuler.</p>
    <div class="chips" id="sch-list">${SCHEMAS.map(x=>`<button class="chipb" type="button" data-sch="${x.id}" aria-pressed="false">${x.titre}</button>`).join('')}</div>
    <div id="sch-view"></div></section>`;
}
function schOpen(id){
  schStop(); const S=SCHEMAS.find(x=>x.id===id)||SCHEMAS[0]; schCur=S; schState=S.init();
  try{ localStorage.setItem('atelier-schema',S.id); }catch(e){}
  document.querySelectorAll('#sch-list .chipb').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sch===S.id)));
  const fils=[...new Set((S.draw(schState).match(/k-(\w+)/g)||[]).map(x=>x.slice(2)))];
  document.getElementById('sch-view').innerHTML=`<h3>${S.titre}</h3><p class="sch-res">${S.resume}</p>
    <div class="sch-fig"><svg viewBox="0 0 400 240" id="sch-svg" role="img" aria-label="Schéma : ${S.titre}"></svg></div>
    <div class="row" id="sch-ctrl"></div>
    <div class="fils">${fils.map(k=>`<span><i class="sw k-${k}"></i>${FILS[k]}</span>`).join('')}</div>
    <div class="sch-txt"><div><b>Comment ça marche</b><ol>${S.marche.map(t=>`<li>${t}</li>`).join('')}</ol></div>
    <div><b>Matériel</b><ul>${S.materiel.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div><b>Bon à savoir</b><ul>${S.conseils.map(t=>`<li>${t}</li>`).join('')}</ul></div></div>
    <p class="warn">Coupez toujours le disjoncteur du circuit avant d’intervenir, et vérifiez l’absence de tension.</p>`;
  if(S.tick) schTimer=setInterval(()=>{ if(!document.getElementById('sch-svg')){ schStop(); return; } if(S.tick(schState)) schDraw(); },150);
  schDraw();
}
function schDraw(){
  const S=schCur, svg=document.getElementById('sch-svg'); if(!S||!svg) return;
  svg.innerHTML=S.draw(schState);
  document.getElementById('sch-ctrl').innerHTML=S.ctrls.map(c=>{
    if(c.type==='choice') return `<div class="seg" role="group">${c.options.map(([v,l])=>`<button type="button" class="btn ghost" data-ctl="${c.id}" data-v="${v}" aria-pressed="${schState[c.id]===v}">${l}</button>`).join('')}</div>`;
    return `<button type="button" class="btn${c.type==='push'?' ghost':''}" data-ctl="${c.id}">${c.lab(schState)}</button>`;
  }).join('');
}
function schAct(id,v){
  const S=schCur; if(!S) return; const c=S.ctrls.find(x=>x.id===id);
  if(c && c.type==='push' || (!c && S.press)){ S.press(schState,id); if(!S.hold){ setTimeout(()=>{ if(schCur===S){ schState.pr=null; schDraw(); } },600); } }
  else if(c && c.type==='toggle') schState[id]=!schState[id];
  else if(v!==undefined) schState[id]=v;
  else if(S.cycle && S.cycle[id]){ const cy=S.cycle[id]; const i=cy.indexOf(schState[id]); schState[id]=cy[(i+1)%cy.length]; }
  schDraw();
}
view.addEventListener('click',e=>{
  if(cur!=='schemas') return;

const plPoly=(pts,cl)=>`<polygon class="${cl}" points="${pts.map(([x,r])=>x+','+(PLY-r)).join(' ')}"/><polygon class="${cl}" points="${pts.map(([x,r])=>x+','+(PLY+r)).join(' ')}"/>`;
const plLab=(x,y,tx,ty,t,anc='start')=>{ if(anc==='start'&&tx>=260) anc='end'; return `<path class="pl-ld" d="M${x} ${y}L${tx} ${ty}"/><text class="pl-tx" x="${tx+(anc==='end'?-3:anc==='middle'?0:3)}" y="${ty+(ty<y?-3:12)}" text-anchor="${anc}">${t}</text>`; };

/* Tuyau vu en perspective, avec sa coupe au bout */
function plTube(couches,o={}){ // couches : de l’extérieur vers l’intérieur [classe, rayon]
  const R=couches[0][1], x1=50, x2=290; let s='';
  s+=`<rect class="${couches[0][0]}" x="${x1}" y="${PLY-R}" width="${x2-x1}" height="${2*R}"/>`;
  s+=`<rect class="pl-reflet" x="${x1}" y="${PLY-R*0.7}" width="${x2-x1}" height="${R*0.25}"/>`;
  if(o.raies) s+=o.raies.map(y=>`<rect class="${o.raieCl}" x="${x1}" y="${PLY+y}" width="${x2-x1}" height="3"/>`).join('');
  if(o.annele){ for(let x=x1+6;x<x2;x+=12) s+=`<path class="pl-ann" d="M${x} ${PLY-R}V${PLY+R}"/>`; }
  if(o.filet){ for(let x=x1;x<x1+44;x+=5) s+=`<path class="pl-ld" d="M${x} ${PLY-R}l3 ${2*R}"/>`; }
  couches.forEach(([cl,r])=>{ s+=`<ellipse class="${cl}" cx="${x2}" cy="${PLY}" rx="${r*0.38}" ry="${r}"/>`; });
  const ri=couches[couches.length-1][1]*o.trou;
  s+=`<ellipse class="pl-vide" cx="${x2}" cy="${PLY}" rx="${ri*0.38}" ry="${ri}"/>`;
  (o.labels||[]).forEach(l=>s+=l);
  return s;
}

function plListe(t,arr){ return `<div><b>${t}</b><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`; }
function plFig(svg,lab){ return `<div class="sch-fig"><svg class="pl-svg" viewBox="0 0 400 170" role="img" aria-label="${lab}">${svg}</svg></div>`; }
function fichesHTML(kind){
  const L=kind==='tuyaux'?PL_TUYAUX:kind==='isolants'?ISOLANTS:kind==='tableau'?EL_ELEMS:kind==='multi'?MM_FICHES:PL_ASSEMB, T=TOOLS[cur];
  let s=kind==='tableau'?`<section class="card"><h2>Le tableau, de l’arrivée aux circuits</h2><p class="hint">Touchez un module pour voir sa fiche plus bas.</p><div class="sch-fig"><svg class="pl-svg el-svg" viewBox="0 0 400 340" role="img" aria-label="Schéma d’un tableau électrique">${elSchema()}</svg></div></section>`:'';
  s+=`<section class="card"><h2>${T.nom}</h2><p class="hint">${T.aide}</p>
    <div class="chips" id="fi-list">${L.map(x=>`<button class="chipb" type="button" data-fi="${x.id}" aria-pressed="false">${x.nom}</button>`).join('')}</div><div id="fi-view"></div></section>`;
  if(kind==='tuyaux') s+=`<section class="card"><h2>Quel diamètre pour chaque appareil ?</h2><p class="hint">Diamètre minimal du tube d’alimentation (eau froide et eau chaude), d’après les règles du DTU 60.11.</p>
    <div class="tbl"><table><thead><tr><th>Appareil</th><th>Ø intérieur mini</th><th>Cuivre</th><th>PER</th><th>Multicouche</th></tr></thead><tbody>
    ${PL_ALIM.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} mm</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint">Arrivée générale d’une maison : Ø 25 mm en général, plus gros si la pression est faible. Au-dessus de 3 bars, un réducteur de pression protège la robinetterie.</p></section>`;

function isoRnd(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function isoMotif(id,type,c1,c2){
  const r=isoRnd(id.length*977+id.charCodeAt(0)), W=48; let g='';
  if(type==='fibres') for(let i=0;i<14;i++){ const x=r()*W,y=r()*W,a=r()*6.28,l=10+r()*14; g+=`<path d="M${x} ${y}q${Math.cos(a+1)*l/2} ${Math.sin(a+1)*l/2} ${Math.cos(a)*l} ${Math.sin(a)*l}" stroke="${c2}" stroke-width="1" fill="none"/>`; }
  if(type==='bois') for(let i=0;i<9;i++){ const y=i*5.3+r()*2; g+=`<path d="M0 ${y}q12 ${r()*4-2} 24 0t24 0" stroke="${c2}" stroke-width="${0.8+r()}" fill="none"/>`; }
  if(type==='flocons') for(let i=0;i<22;i++){ const x=r()*W,y=r()*W,s=1.5+r()*3; g+=`<path d="M${x} ${y}l${s} ${-s/2}l${s/2} ${s}l${-s} ${s/2}z" fill="${c2}"/>`; }
  if(type==='billes') for(let i=0;i<4;i++) for(let j=0;j<4;j++) g+=`<circle cx="${i*12+6+(j%2)*3}" cy="${j*12+6}" r="5.6" fill="none" stroke="${c2}" stroke-width=".8"/>`;
  if(type==='lisse') for(let j=0;j<4;j++) g+=`<path d="M0 ${j*12+3}H48" stroke="${c2}" stroke-width=".6"/>`;
  if(type==='mousse') for(let i=0;i<40;i++) g+=`<circle cx="${r()*W}" cy="${r()*W}" r="${0.5+r()}" fill="${c2}"/>`;
  if(type==='liege') for(let i=0;i<26;i++) g+=`<circle cx="${r()*W}" cy="${r()*W}" r="${1+r()*3}" fill="${c2}"/>`;
  if(type==='mince') for(let j=0;j<8;j++) g+=`<rect x="0" y="${j*6}" width="48" height="3" fill="${j%2?c2:'#e9eef2'}" style="stroke:none"/>`;
  return `<pattern id="pt-${id}" width="${W}" height="${W}" patternUnits="userSpaceOnUse"><rect width="${W}" height="${W}" fill="${c1}" style="stroke:none"/>${g}</pattern>`;
}
function isoBloc(I){
  const x0=70,y0=58,w=200,h=78,dx=46,dy=-34, f=`url(#pt-${I.id})`, top=I.dessus||f;
  return `<defs>${isoMotif(I.id,I.motif,I.c1,I.c2)}</defs>
    <path d="M${x0} ${y0}h${w}l${dx} ${dy}h${-w}z" fill="${top}" stroke="#3a3f44" stroke-width=".8"/>
    <path d="M${x0+w} ${y0}l${dx} ${dy}v${h}l${-dx} ${-dy}z" fill="${f}" stroke="#3a3f44" stroke-width=".8"/><path d="M${x0+w} ${y0}l${dx} ${dy}v${h}l${-dx} ${-dy}z" fill="#000" opacity=".18"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${f}" stroke="#3a3f44" stroke-width=".8"/>
    <path class="pl-ld" d="M${x0} ${y0+h+8}h${w}M${x0} ${y0+h+4}v8M${x0+w} ${y0+h+4}v8"/>
    <text class="pl-tx" x="${x0+w/2}" y="${y0+h+22}" text-anchor="middle">${I.forme}</text>
    ${I.lt?`<text class="pl-tx" x="${x0+w+dx+8}" y="${y0+dy+40}">λ</text>`:''}${I.lt?`<text class="pl-tx" x="${x0+w+dx+8}" y="${y0+dy+54}">${I.lam}</text>`:''}`;
}

/* Un module modulaire vu de face (s = largeur d’un module en px) */
function elMod(x,y,m,s=26,h=100){
  const w=m.w*s, cx=x+w/2; let g=`<rect class="el-body" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`;
  const vis=n=>Array.from({length:n},(_,i)=>x+w*(i+0.5)/n);
  const nb=Math.max(2,Math.min(m.w*2,4));
  vis(nb).forEach(vx=>{ g+=`<circle class="el-vis" cx="${vx}" cy="${y+8}" r="${Math.min(4,s*0.16)}"/><circle class="el-vis" cx="${vx}" cy="${y+h-8}" r="${Math.min(4,s*0.16)}"/>`; });
  if(m.kind==='bornier'){ for(let i=0;i<m.w*2;i++) g+=`<rect class="${i%2?'el-bn':'el-bp'}" x="${x+4+i*(w-8)/(m.w*2)}" y="${y+20}" width="${(w-8)/(m.w*2)-2}" height="${h-40}" rx="2"/>`; return g; }
  if(m.lev){ const lw=Math.min(w*0.5,s*0.7); g+=`<rect class="el-fen" x="${cx-lw/2-3}" y="${y+h*0.34}" width="${lw+6}" height="${h*0.3}" rx="2"/><rect class="el-lev el-lev-${m.lev}" x="${cx-lw/2}" y="${y+h*0.36}" width="${lw}" height="${h*0.14}" rx="2"/>`; }
  if(m.btn) g+=`<rect class="el-btn" x="${x+w-s*0.42}" y="${y+h*0.7}" width="${s*0.3}" height="${s*0.3}" rx="2"/><text class="el-mt" x="${x+w-s*0.27}" y="${y+h*0.7+s*0.23}" text-anchor="middle">T</text>`;
  if(m.win) g+=`<rect x="${cx-s*0.35}" y="${y+h*0.4}" width="${s*0.7}" height="${h*0.14}" rx="2" fill="#3fbf5f"/>`;
  if(m.sel) g+=`<rect class="el-fen" x="${cx-s*0.3}" y="${y+h*0.3}" width="${s*0.6}" height="${h*0.36}" rx="2"/><rect class="el-lev el-lev-d" x="${cx-s*0.22}" y="${y+h*0.43}" width="${s*0.44}" height="${h*0.1}" rx="2"/>${s>=30?`<text class="el-mt" x="${cx}" y="${y+h*0.27}" text-anchor="middle">1 · A · 0</text>`:''}`;
  if(m.dial) g+=`<circle class="el-fen" cx="${cx}" cy="${y+h*0.48}" r="${s*0.32}"/><path d="M${cx} ${y+h*0.48}l${s*0.2} ${-s*0.15}" stroke="#333" stroke-width="2"/>`;
  if(m.lcd) g+=`<rect x="${x+5}" y="${y+h*0.32}" width="${w-10}" height="${h*0.22}" rx="2" fill="#bfe3c8" stroke="#555"/>`;
  if(m.socket) g+=`<circle class="el-fen" cx="${cx}" cy="${y+h*0.5}" r="${Math.min(w,h)*0.3}"/><circle cx="${cx-8}" cy="${y+h*0.5}" r="3" fill="#333"/><circle cx="${cx+8}" cy="${y+h*0.5}" r="3" fill="#333"/>`;
  if(m.bp) g+=`<rect class="el-fen" x="${cx-s*0.3}" y="${y+h*0.38}" width="${s*0.6}" height="${h*0.2}" rx="2"/>`;
  if(m.t1) g+=`<text class="el-mt" x="${cx}" y="${m.sel?y+h*0.82:Math.max(y+h*0.24,y+22)}" text-anchor="middle">${m.t1}</text>`;
  if(m.t2) g+=`<text class="el-mt" x="${cx}" y="${y+h*0.86}" text-anchor="middle">${m.t2}</text>`;
  return g;
}
/* Dessin d’une fiche : le module sur son rail, les fils qui arrivent en haut et repartent en bas */
function elDessin(E){
  const s=34, h=110, W=E.mods.reduce((t,m)=>t+m.w,0)*s, x0=Math.max(20,150-W/2), y0=36;
  let g=`<rect class="el-rail" x="10" y="${y0+h/2-9}" width="380" height="18"/>`, x=x0;
  const fils=(arr,y1,y2,lab,ytx)=>{ if(!arr||!arr.length) return ''; let r=''; const n=arr.length;
    arr.forEach((c,i)=>{ const fx=x0+W*(i+0.5)/n; r+=`<path class="${EL_FIL[c]}" d="M${fx} ${y1}V${y2}"/>`; if(c==='t') r+=`<path class="el-t2" d="M${fx} ${y1}V${y2}"/>`; });
    return r+`<text class="pl-tx" x="${x0+W+12}" y="${ytx}">${lab}</text>`; };
  g+=fils(E.haut,y0+8,4,E.hautLab,20)+fils(E.bas,y0+h-8,176,E.basLab,170);
  E.mods.forEach(m=>{ g+=elMod(x,y0,m,s,h); x+=m.w*s; });
  return g;
}

/* Dessins spéciaux : peigne et bornier de terre */
function elPeigne(){ const s=34,x0=60,y0=40,h=110; let g=`<rect class="el-rail" x="10" y="${y0+h/2-9}" width="380" height="18"/>`;
  const ms=[{w:2,t1:'30 mA',t2:'ID',lev:'b',btn:true},{w:1,t1:'C10',lev:'d'},{w:1,t1:'C16',lev:'d'},{w:1,t1:'C20',lev:'d'},{w:1,t1:'C20',lev:'d'},{w:1,t1:'C32',lev:'d'}]; let x=x0;
  ms.forEach(m=>{ g+=elMod(x,y0,m,s,h); x+=m.w*s; });
  g+=`<rect x="${x0}" y="${y0-16}" width="${x-x0}" height="10" rx="2" fill="#e8dfc9" stroke="#555"/>`;
  for(let i=0;i<14;i++){ const dx=x0+s*0.25+i*s/2; if(dx>x-4) break; g+=`<path class="${i%2?'el-n':'el-ph'}" d="M${dx} ${y0-6}V${y0+8}"/>`; }
  return g+`<text class="pl-tx" x="${x0}" y="${y0-22}">peigne horizontal : phase et neutre pour toute la rangée</text>`; }
function elTerre(){ let g=`<rect x="60" y="40" width="230" height="22" rx="3" fill="#cfe6c8" stroke="#555"/>`;
  for(let i=0;i<8;i++){ const x=76+i*27; g+=`<circle class="el-vis" cx="${x}" cy="51" r="5"/><path class="el-t" d="M${x} 51V10"/><path class="el-t2" d="M${x} 51V10"/>`; }
  g+=`<path class="el-t" d="M76 51H40V150"/><path class="el-t2" d="M76 51H40V150"/><rect x="28" y="110" width="24" height="16" rx="2" fill="#e0e0e0" stroke="#555"/>`
   +`<path d="M40 150v20M30 170h20M33 174h14M36 178h8" stroke="#555" stroke-width="2"/>`
   +`<text class="pl-tx" x="300" y="30">un fil vert et jaune</text><text class="pl-tx" x="300" y="44">par circuit</text>`
   +`<text class="pl-tx" x="60" y="122">barrette de mesure</text><text class="pl-tx" x="60" y="168">piquet de terre (moins de 100 ohms)</text>`

  return g; }

function elSchema(){
  const s=22,h=64,ph=d=>`<path class="el-ph" d="${d}"/><path class="el-flux" d="${d}"/>`,nt=d=>`<path class="el-n" d="${d}"/>`,te=d=>`<path class="el-t" d="${d}"/><path class="el-t2" d="${d}"/>`,dot=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="3" fill="${c}"/>`;
  let g=`<rect class="el-cof" x="104" y="70" width="290" height="250" rx="8"/>`;
  g+=`<rect class="el-body" x="8" y="6" width="70" height="40" rx="4"/><text class="el-mt" x="43" y="23" text-anchor="middle">Compteur</text><text class="el-mt" x="43" y="36" text-anchor="middle">Linky</text>`;
  g+=ph('M54 46V74')+nt('M30 46V74');
  g+=`<g class="el-mod" data-fi="agcp">${elMod(14,74,{w:3,t1:'Disj. de',t2:'branch.',lev:'g'},20,60)}</g>`;
  // alimentation du peigne vertical (phase x=112, neutre x=118)
  g+=ph('M54 134V284H112V86')+nt('M30 134V290H118V86')+`<text class="pl-tx" x="8" y="150">10 ou</text><text class="pl-tx" x="8" y="162">16 mm²</text>`;
  g+=`<g class="el-mod" data-fi="repartiteur"><rect x="108" y="80" width="14" height="214" rx="3" fill="transparent" stroke="var(--muted)" stroke-dasharray="3 3"/></g>`;
  let x; const r1=96, r2=196, add=(m,id,y)=>{ g+=`<g class="el-mod" data-fi="${id}">${elMod(x,y,m,s,h)}</g>`; x+=m.w*s; };
  // rangée 1 : parafoudre puis différentiel AC
  x=126; add({w:2,t1:'PF',win:true},'parafoudre',r1);
  g+=ph('M112 90H131.5V104')+nt('M118 86H142.5V104')+dot(112,90,'#8b4a2b')+dot(118,86,'#2f6fd6');
  const xid1=x; add({w:2,t1:'ID AC',lev:'b',btn:true},'id',r1);
  ['C10','C16','C20','C20','C20'].forEach(t=>add({w:1,t1:t,lev:'d'},'disj',r1)); const xhc=x; add({w:1,t1:'HC',sel:true},'hc',r1); add({w:1,t1:'C2',lev:'d'},'disj',r1);
  g+=`<g class="el-mod" data-fi="peigne"><rect x="${xid1}" y="${r1-9}" width="${x-xid1}" height="7" rx="2" fill="#e8dfc9" stroke="#555"/></g>`;
  g+=ph(`M112 168H${xid1+5.5}V${r1+h-8}`)+nt(`M118 172H${xid1+16.5}V${r1+h-8}`)+dot(112,168,'#8b4a2b')+dot(118,172,'#2f6fd6');
  // rangée 2 : différentiel A
  x=126; const xid2=x; add({w:2,t1:'ID A',lev:'b',btn:true},'id',r2);
  ['C32','C20','C20','C20'].forEach(t=>add({w:1,t1:t,lev:'d'},'disj',r2)); add({w:1,t1:'TL',bp:true},'tele',r2); add({w:2,t1:'Délest.'},'delesteur',r2); add({w:2,t1:'Prog.',lcd:true},'prog',r2);
  g+=`<g class="el-mod" data-fi="peigne"><rect x="${xid2}" y="${r2-9}" width="${6*s+2*s}" height="7" rx="2" fill="#e8dfc9" stroke="#555"/></g>`;
  g+=ph(`M112 268H${xid2+5.5}V${r2+h-8}`)+nt(`M118 274H${xid2+16.5}V${r2+h-8}`)+dot(112,268,'#8b4a2b')+dot(118,274,'#2f6fd6');
  // terre
  g+=te(`M${126+38.5} ${r1+h-8}V180H124V306H200`)+`<g class="el-mod" data-fi="terre"><rect x="200" y="300" width="160" height="12" rx="3" fill="#cfe6c8" stroke="#555"/><text class="el-mt" x="280" y="309" text-anchor="middle">bornier de terre</text></g>`;
  g+=te('M200 312H90V330')+`<text class="pl-tx" x="96" y="332">vers la prise de terre</text>`;
  // commande heures creuses
  g+=`<path class="el-cmd" d="M${xhc+11} ${r1}V58H78"/><text class="pl-tx" x="150" y="54">ordre « heures creuses » du compteur</text>`;
  g+=`<text class="pl-tx" x="200" y="180">rangée 1 : différentiel type AC</text><text class="pl-tx" x="200" y="282">rangée 2 : différentiel type A</text>`;
  return g;
}

const MM_POS=[['OFF',-90],['V~',-45],['V⎓',-5],['Ω',35],['bip',75],['A',125],['mA',165],['Hz',-135]];
const MM_JACK={a:40,ma:66,com:96,v:124};
function mmAppareil(sel,disp,unite){
  const cx=85,cy=96; let g=`<rect x="22" y="8" width="128" height="176" rx="14" fill="#f2c94c" stroke="#5a4a12"/><rect x="30" y="16" width="112" height="160" rx="9" fill="#3a3f45"/>`;
  g+=`<rect x="40" y="24" width="92" height="34" rx="4" fill="#c7d9b8"/><text x="126" y="50" text-anchor="end" font-size="20" font-family="ui-monospace,monospace" fill="#1d2a1d">${disp}</text><text x="44" y="34" font-size="8" fill="#1d2a1d">${unite||''}</text>`;
  MM_POS.forEach(([t,a])=>{ const r=a*Math.PI/180, x=cx+Math.cos(r)*40, y=cy+Math.sin(r)*36+3; g+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="${t===sel?10:8.5}" font-weight="${t===sel?700:400}" fill="${t===sel?'#ffd54a':'#e9ecef'}">${t==='bip'?'•)))':t}</text>`; });
  const a=(MM_POS.find(p=>p[0]===sel)||MM_POS[0])[1]*Math.PI/180;
  g+=`<circle cx="${cx}" cy="${cy}" r="22" fill="#20252a" stroke="#888"/><path d="M${cx-Math.cos(a)*8} ${cy-Math.sin(a)*8}L${cx+Math.cos(a)*19} ${cy+Math.sin(a)*19}" stroke="#ffd54a" stroke-width="5" stroke-linecap="round"/>`;
  [['a','10A'],['ma','mA'],['com','COM'],['v','VΩ']].forEach(([k,t])=>{ const x=MM_JACK[k]; g+=`<circle cx="${x}" cy="150" r="7" fill="${k==='com'?'#111':'#7a1b1b'}" stroke="#aaa"/><text x="${x}" y="170" text-anchor="middle" font-size="8" fill="#e9ecef">${t}</text>`; });
  return g;
}
