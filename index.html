<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papy la Bricole</title>
<meta name="description" content="L'atelier de Papy la Bricole : calculs de bricolage, menuiserie, électricité, maçonnerie et plus encore.">
<meta name="theme-color" content="#2a1d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="preload" as="image" href="accueil.jpg">
<link rel="preload" as="image" href="papy.webp">
<link rel="preload" as="image" href="porte-fermee.webp">
<link rel="prefetch" href="atelier.html">
<style>
  /* Page d'accueil : photo entière ; un battant dessiné ferme l'atelier ; Papy (détouré) reste devant ;
     un clic sur la pancarte « Entrée » ouvre le battant, puis la scène avance vers la porte en fondu. */
  html,body{margin:0;height:100%;background:#2a1d12}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
  .fond{position:fixed;inset:-30px;background:#2a1d12 url(accueil-flou.jpg) center/cover;filter:blur(18px) brightness(.5)}
  .scene{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh;box-shadow:0 10px 40px rgba(0,0,0,.5);
    transform-origin:43% 62%;transition:transform 1.1s cubic-bezier(.5,0,.75,0)}
  .scene>img{display:block;user-select:none;-webkit-user-drag:none}
  .scene>.photo{position:absolute;inset:0;width:100%;height:100%}
  .ouverture{position:absolute;left:21.484%;top:23.047%;width:43.424%;height:76.953%;perspective:1400px;perspective-origin:85% 45%;overflow:visible}
  .battant{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 50%;transform:rotateY(0deg);
    transition:transform 2.4s cubic-bezier(.45,.05,.3,1),filter 2.4s ease;backface-visibility:visible;filter:brightness(1);
    box-shadow:0 0 0 rgba(0,0,0,0)}
  .ouvre .battant{transform:rotateY(84deg);filter:brightness(.55)}
  .battant img{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ombre-b{position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,20,6,.42),rgba(42,20,6,.04) 18%,rgba(42,20,6,0) 85%,rgba(42,20,6,.18)),linear-gradient(90deg,rgba(42,20,6,.25),rgba(42,20,6,0) 22%)}
  .papy{position:absolute;left:19.531%;top:20.996%;width:34.505%;height:auto;pointer-events:none}
  .entree{position:absolute;left:66.4%;top:37.6%;width:26.6%;height:29.8%;border-radius:2.5%;transform:rotate(-1.5deg);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .entree::after{content:"";position:absolute;inset:0;border-radius:inherit;transition:box-shadow .25s,background-color .25s}
  .entree:hover::after,.entree:focus-visible::after{box-shadow:0 0 0 4px rgba(255,214,120,.95),0 0 30px 10px rgba(255,200,90,.6);background-color:rgba(255,236,170,.14)}
  .entree:focus{outline:none}
  @media (hover:none){ .entree::after{animation:appel 2.6s ease-in-out infinite} }
  @keyframes appel{0%,100%{box-shadow:0 0 0 0 rgba(255,214,120,0)}50%{box-shadow:0 0 0 4px rgba(255,214,120,.85),0 0 24px 6px rgba(255,200,90,.5)}}
  .ouvre .entree{pointer-events:none} .ouvre .entree::after{animation:none;box-shadow:none;background:none}
  .voile{position:fixed;inset:0;background:#f3f4f1;opacity:0;pointer-events:none;transition:opacity 1.1s ease-in}
  .entrer .scene{transform:scale(1.9)}
  .entrer .voile{opacity:1}
  .aide{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:#f6e6c8;
    font:600 16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .4s}
  .ouvre .aide{opacity:0}
  .son{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:5;width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.4);background:rgba(30,18,8,.55);color:#f6e6c8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .son svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .son:focus-visible{outline:3px solid #ffd678;outline-offset:2px}
  .son[aria-pressed="false"] .ondes{display:none} .son[aria-pressed="true"] .barre{display:none}
  @media (prefers-color-scheme:dark){ .voile{background:#171a1d} }
  @media (prefers-reduced-motion:reduce){ .entree::after{animation:none;box-shadow:0 0 0 3px rgba(255,214,120,.8)} .battant,.scene,.voile{transition-duration:.01s} }
</style>
</head>
<body>
  <div class="fond" aria-hidden="true"></div>
  <main class="scene">
    <img class="photo" src="accueil.jpg" width="1536" height="1024" alt="Papy la Bricole, devant la porte de son atelier, invite à entrer.">
    <div class="ouverture"><div class="battant"><img src="porte-fermee.webp" width="1154" height="1363" alt=""><span class="ombre-b"></span></div></div>
    <img class="papy" src="papy.webp" width="530" height="809" alt="" aria-hidden="true">
    <a class="entree" href="atelier.html" aria-label="Entrée : ouvrir la porte de l’atelier"></a>
  </main>
  <div class="voile" aria-hidden="true"></div>
  <button class="son" id="son" type="button" aria-pressed="true" aria-label="Son de la porte : activé">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ondes" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="barre" d="M16 9l6 6M22 9l-6 6"/></svg>
  </button>
  <p class="aide" id="aide">Touchez la pancarte « Entrée »</p>
<script>
  if (matchMedia('(hover:hover)').matches) document.getElementById('aide').textContent = 'Cliquez sur la pancarte « Entrée »';
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

  // Son : grincement de gond fabriqué par le calcul (pas de fichier à charger), avec un petit « clac » de loquet au départ
  const btnSon=document.getElementById('son'); let sonOn=true;
  try{ sonOn=localStorage.getItem('papy-son')!=='0'; }catch(x){}
  const majSon=()=>{ btnSon.setAttribute('aria-pressed',String(sonOn)); btnSon.setAttribute('aria-label','Son de la porte : '+(sonOn?'activé':'coupé')); };
  majSon(); btnSon.addEventListener('click',()=>{ sonOn=!sonOn; majSon(); try{ localStorage.setItem('papy-son',sonOn?'1':'0'); }catch(x){} });
  function grincement(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(), sr=ctx.sampleRate, dur=2.5, N=Math.floor(sr*dur), x=new Float32Array(N);
    let graine=7; const hasard=()=>{ graine=(graine*16807)%2147483647; return graine/2147483647; };
    for(let i=0;i<sr*0.03;i++) x[i]+=(hasard()*2-1)*Math.exp(-i/(sr*0.004))*0.12;
    const phrases=[[0.16,0.95,0.8],[1.02,1.78,1],[1.86,2.42,0.7]];
    for(const [d,f,g] of phrases){ let t=d;
      while(t<f){ const u=(t-d)/(f-d), env=Math.pow(Math.sin(Math.PI*u),0.6);
        const cad=42+100*Math.sin(Math.PI*Math.min(1,u*1.1))+18*Math.sin(2*Math.PI*3.1*t)+(hasard()-0.5)*16;
        const i=Math.floor(t*sr); if(i<N) x[i]+=g*env*(0.6+0.5*hasard());
        t+=1/Math.max(20,cad); } }
    const out=new Float32Array(N);
    for(const [fc,bw,g] of [[540,28,1],[1150,45,0.85],[2300,80,0.5],[3600,140,0.25]]){
      const r=Math.exp(-Math.PI*bw/sr), a1=-2*r*Math.cos(2*Math.PI*fc/sr), a2=r*r, b0=(1-r)*g; let y1=0,y2=0;
      for(let i=0;i<N;i++){ const y=b0*x[i]-a1*y1-a2*y2; y2=y1; y1=y; out[i]+=y; } }
    let m=0; for(let i=0;i<N;i++) m=Math.max(m,Math.abs(out[i]));
    const buf=ctx.createBuffer(1,N,sr), ch=buf.getChannelData(0), k=m?0.75/m:1; for(let i=0;i<N;i++) ch[i]=out[i]*k;
    const src=ctx.createBufferSource(), gain=ctx.createGain(); gain.gain.value=0.8; src.buffer=buf; src.connect(gain); gain.connect(ctx.destination);
    if(ctx.state==='suspended') ctx.resume(); src.start();
  }
  // Ouverture : la porte s'ouvre (2,4 s), puis on avance vers l'atelier en fondu (1,1 s), puis la page de l'atelier s'affiche
  const lien = document.querySelector('.entree'), lent = !matchMedia('(prefers-reduced-motion:reduce)').matches;
  let parti = false;
  lien.addEventListener('click', e => {
    e.preventDefault(); if (parti) return; parti = true;
    try { sessionStorage.setItem('atelier-entree', '1'); } catch (x) {}
    if(sonOn && lent){ try{ grincement(); }catch(x){} }
    document.body.classList.add('ouvre');
    setTimeout(() => document.body.classList.add('entrer'), lent ? 2100 : 0);
    setTimeout(() => { location.href = lien.href; }, lent ? 3250 : 50);
  });
  // Retour en arrière depuis l'atelier : la porte se referme
  addEventListener('pageshow', e => { if (e.persisted) { parti = false; document.body.classList.remove('ouvre', 'entrer'); } });
</script>
</body>
</html>
